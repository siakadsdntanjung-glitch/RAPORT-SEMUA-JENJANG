<style>
  :root{
    --maroon:#6B1E23;
    --maroon-dark:#4E1519;
    --navy:#1C2541;
    --navy-light:#2B3A63;
    --gold:#B3872F;
    --gold-light:#D9B25C;
    --parchment:#FBF7EF;
    --paper:#FFFFFF;
    --ink:#241C15;
    --ink-soft:#5B5245;
    --line:#E4DBC8;
    --good:#3C6E47;
    --bad:#A23B2E;
    --bg:var(--parchment);
    --surface:var(--paper);
    --text:var(--ink);
    --text-soft:var(--ink-soft);
    --border:var(--line);
    --shadow: 0 1px 2px rgba(36,28,21,.06), 0 8px 24px rgba(36,28,21,.06);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#15130F;
      --surface:#1E1B15;
      --text:#F3EEE3;
      --text-soft:#C7BEAC;
      --border:#3A3327;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15130F;
    --surface:#1E1B15;
    --text:#F3EEE3;
    --text-soft:#C7BEAC;
    --border:#3A3327;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
  a{color:inherit;}
  ::selection{background:var(--gold-light);color:var(--navy);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}

  .field-input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--border);
    padding:10px 2px;
    font-size:15px;
    color:var(--text);
    transition:border-color .15s ease;
  }
  .field-input:focus{border-bottom-color:var(--maroon);outline:none;}
  select.field-input{cursor:pointer;}

  .box-input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:9px 11px;
    font-size:14px;
    color:var(--text);
  }
  .box-input:focus{border-color:var(--maroon);outline:none;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 18px;border-radius:6px;font-size:14px;font-weight:600;
    border:1px solid transparent; transition:filter .15s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--maroon);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--maroon);color:var(--maroon);}
  .btn-gold{background:var(--gold);color:#2A2005;}
  .btn-gold:hover{filter:brightness(1.06);}
  .btn-danger{background:transparent;color:var(--bad);border-color:var(--bad);}
  .btn-danger:hover{background:var(--bad);color:#fff;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);}
  .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.2px;}

  table.ledger{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.ledger th{
    text-align:left;padding:10px 12px;border-bottom:2px solid var(--maroon);
    color:var(--text-soft);font-weight:600;font-size:12.5px;white-space:nowrap;
  }
  table.ledger td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.ledger tr:last-child td{border-bottom:none;}
  table.ledger tbody tr:hover{background:rgba(107,30,35,.04);}

  .sidebar-link{
    display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:7px;
    font-size:14px;font-weight:500;color:#C9CEDE;transition:background .12s ease;
    text-align:left;
  }
  .sidebar-link:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar-link.active{background:var(--maroon);color:#fff;}
  .sidebar-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;flex-shrink:0;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(28,37,65,.55);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-box{background:var(--surface);border-radius:12px;max-width:560px;width:100%;
    max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-footer-sticky{position:sticky;bottom:-1px;background:var(--surface);
    padding:14px 0 2px;margin-top:14px;border-top:1px solid var(--border);
    display:flex;gap:8px;justify-content:flex-end;}

  .toast{position:fixed;bottom:22px;right:22px;z-index:200;background:var(--navy);color:#fff;
    padding:13px 20px;border-radius:8px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:10px;max-width:340px;}
  .toast.err{background:var(--bad);}
  .toast.ok{background:var(--good);}

  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;}

  .role-tab{
    padding:11px 14px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:10px;color:var(--text-soft);border:1px solid transparent;
  }
  .role-tab.active{background:var(--maroon);color:#fff;}
  .role-tab:not(.active):hover{background:rgba(107,30,35,.06);color:var(--maroon);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

  .scroll-x{overflow-x:auto;}

  #print-area{ display:none; }
  @media print{
    @page{ margin:15mm; }
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;left:0;top:0;width:100%;}
    #print-area *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .no-print{display:none !important;}
  }

  .seal{
    width:78px;height:78px;border-radius:50%;border:2.5px solid var(--gold-light);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .seal::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold-light);border-radius:50%;opacity:.6;}
  .seal-txt{font-family:'Fraunces',serif;color:var(--gold-light);font-size:11px;letter-spacing:1px;text-align:center;line-height:1.3;}

  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--maroon);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .fade-in{animation:fadeIn .25s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ---- Login animation ---- */
  #left-panel{position:relative;background-size:220% 220%;animation:panGradient 18s ease-in-out infinite;}
  @keyframes panGradient{
    0%{background-position:0% 30%;}
    50%{background-position:100% 70%;}
    100%{background-position:0% 30%;}
  }
  .glow-blob{
    position:absolute;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle, rgba(217,178,92,.28) 0%, rgba(217,178,92,0) 70%);
    filter:blur(6px); pointer-events:none;
    animation:driftBlob 13s ease-in-out infinite;
  }
  .glow-blob.b2{
    background:radial-gradient(circle, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 70%);
    animation:driftBlob2 17s ease-in-out infinite;
  }
  @keyframes driftBlob{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(34px,-26px) scale(1.08);}
  }
  @keyframes driftBlob2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-28px,22px) scale(1.05);}
  }
  .seal-anim{animation:sealPulse 4.5s ease-in-out infinite;}
  @keyframes sealPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(217,178,92,.35);}
    50%{box-shadow:0 0 0 9px rgba(217,178,92,0);}
  }
  .reveal{opacity:0;animation:revealUp .7s cubic-bezier(.2,.8,.2,1) forwards;}
  @keyframes revealUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .r1{animation-delay:.05s;} .r2{animation-delay:.18s;} .r3{animation-delay:.32s;} .r4{animation-delay:.46s;} .r5{animation-delay:.58s;}

  .role-tab{transition:background .18s ease, color .18s ease, transform .12s ease, border-color .18s ease;}
  .role-tab.active{transform:translateY(-1px);}
  .role-tab svg{transition:transform .18s ease;}
  .role-tab:hover svg{transform:scale(1.12);}

  @media (prefers-reduced-motion: reduce){
    #left-panel, .glow-blob, .seal-anim, .reveal{animation:none !important;}
    .reveal{opacity:1;transform:none;}
  }
</style>
</head>

<script>
/* ===================== FIREBASE INIT ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyDP_1enNeeVb_VqvV7LQ6q0bDeIXzl2YFE",

  databaseURL: "https://raportkumer2026-default-rtdb.firebaseio.com",
  projectId: "raportkumer2026",
  storageBucket: "raportkumer2026.firebasestorage.app",
  messagingSenderId: "782029748844",
  appId: "1:782029748844:web:6b5c3f743a1f2622a83649",
  measurementId: "G-FD3KDV82WJ"
};
const app = firebase.initializeApp(firebaseConfig);
const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
const auth = app.auth();
const secondaryAuth = secondaryApp.auth();
const db = app.database();
/* Database milik app sekunder: dipakai saat pendaftaran mandiri, agar penulisan data
   berjalan atas nama akun yang baru dibuat tanpa mengganggu sesi di tab utama. */
const secondaryDb = secondaryApp.database();

/* ===================== LOGO APLIKASI ===================== */
/* Disimpan sebagai data URI agar file tetap satu berkas HTML yang berdiri sendiri
   (tidak bergantung pada file gambar terpisah). */
const APP_LOGO = document.getElementById('app-favicon').getAttribute('href');

/* ===================== VERSI APLIKASI ===================== */
/* PENTING: samakan angka ini dengan field "version" di package.json setiap kali merilis
   pembaruan aplikasi desktop. Saat dibungkus dengan Electron (lihat main.js/preload.js),
   nilai ini otomatis disinkronkan dari package.json lewat window.desktopApp.getVersion(). */
let APP_VERSION = '1.0.2';
if(window.desktopApp && typeof window.desktopApp.getVersion === 'function'){
  window.desktopApp.getVersion().then(v=>{ if(v) APP_VERSION = v; });
}
/* Bandingkan dua nomor versi bergaya semver ("1.2.3"). True jika `remote` lebih baru dari `local`. */
function isNewerVersion(remote, local){
  const r = String(remote).split('.').map(n=>parseInt(n,10)||0);
  const l = String(local).split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(r.length,l.length);i++){
    const rv = r[i]||0, lv = l[i]||0;
    if(rv>lv) return true;
    if(rv<lv) return false;
  }
  return false;
}
/* ===================== RILIS DARI GITHUB ===================== */
/* Ganti dengan "namaAkunGitHub/namaRepo" milik Anda (repo tempat build/installer aplikasi
   dirilis lewat fitur "Releases" GitHub). Repo boleh privat maupun publik — untuk repo
   privat, endpoint di bawah butuh token dan sebaiknya dipanggil lewat backend, bukan
   langsung dari browser. */
const GITHUB_REPO = 'namaAkun/nama-repo';

/* Mengambil rilis TERBARU (bukan pre-release/draft) dari GitHub lewat REST API publiknya.
   Tidak butuh autentikasi untuk repo publik. Mengembalikan null bila gagal atau belum
   ada rilis sama sekali, supaya pemanggilnya bisa menampilkan pesan yang sesuai. */
async function fetchLatestGithubRelease(){
  try{
    const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const tag = String(data.tag_name||'').replace(/^v/i,'');
    // Utamakan aset pertama yang diunggah pada rilis (mis. installer .exe/.dmg/.AppImage).
    // Bila tidak ada aset yang dilampirkan, arahkan ke halaman rilis itu sendiri.
    const asset = Array.isArray(data.assets) && data.assets.length ? data.assets[0] : null;
    return {
      version: tag || null,
      downloadUrl: asset ? asset.browser_download_url : data.html_url,
      catatan: data.body || '',
      halamanRilis: data.html_url,
    };
  }catch(e){
    console.warn('Tidak dapat mengambil rilis terbaru dari GitHub:', e);
    return null;
  }
}

/* Menulis info versi ke node "config" di Firebase, supaya SEMUA pengguna (bukan hanya
   yang membuka halaman ini) langsung terpengaruh lewat checkForUpdate(). Hanya dipanggil
   dari panel Admin Utama, dan aturan keamanan Firebase perlu diset agar hanya Admin
   Utama yang boleh menulis ke "config". */
async function publikasikanVersiKeFirebase({ downloadUrl, latestVersion, minVersion, versionGatesMessage }){
  await db.ref('config').update({
    downloadUrl: downloadUrl || '',
    latestVersion: latestVersion || '',
    minVersion: minVersion || '',
    versionGatesMessage: versionGatesMessage || '',
  });
}

/* ===================== GATE VERSI (WAJIB / OPSIONAL) ===================== */
/* Dibaca dari node "config" di Firebase, dengan EMPAT field bersaudara (bukan bersarang):
     config/downloadUrl            -> tautan unduhan installer terbaru
     config/latestVersion          -> versi terbaru yang tersedia (notifikasi, boleh dilewati)
     config/minVersion             -> versi minimum yang masih boleh dipakai (di bawah ini WAJIB update)
     config/versionGatesMessage    -> pesan khusus yang ditampilkan saat WAJIB update
   Jika APP_VERSION < minVersion  -> aplikasi diblokir total (renderVersionGate), tidak bisa dilewati.
   Jika APP_VERSION < latestVersion (tapi masih >= minVersion) -> hanya notifikasi banner, bisa ditutup. */
let versionGate = null; // diisi bila aplikasi harus diblokir
async function checkForUpdate(){
  try{
    const snap = await db.ref('config').once('value');
    const cfg = snap.val() || {};
    const fallbackUrl = `https://github.com/${GITHUB_REPO}/releases/latest`;

    if(cfg.minVersion && isNewerVersion(String(cfg.minVersion), APP_VERSION)){
      versionGate = {
        minVersion: String(cfg.minVersion),
        downloadUrl: cfg.downloadUrl || fallbackUrl,
        pesan: cfg.versionGatesMessage || 'Versi aplikasi Anda sudah tidak didukung lagi. Perbarui aplikasi untuk melanjutkan.',
      };
      render(); // paksa tampilkan layar blokir sekarang, menggantikan apa pun yang sedang tampil
      return;
    }
    if(cfg.latestVersion && isNewerVersion(String(cfg.latestVersion), APP_VERSION)){
      showUpdateBanner(String(cfg.latestVersion), cfg.downloadUrl || fallbackUrl);
    }
  }catch(e){ console.warn('Tidak dapat memeriksa versi terbaru:', e); }
}
/* Layar blokir penuh, TIDAK ada tombol tutup — pengguna wajib memperbarui aplikasi
   sebelum bisa melanjutkan. Ditampilkan menggantikan seluruh isi halaman. */
function renderVersionGate(){
  $app().innerHTML = `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:24px;">
    <div class="card" style="max-width:440px;width:100%;padding:32px 28px;text-align:center;">
      <img src="${APP_LOGO}" alt="Logo" style="width:64px;height:64px;object-fit:cover;border-radius:50%;margin:0 auto 16px;display:block;">
      <h2 style="font-size:19px;margin:0 0 10px;">Pembaruan Wajib</h2>
      <p style="color:var(--text-soft);font-size:13.5px;line-height:1.7;margin:0 0 6px;">${escHtml(versionGate.pesan)}</p>
      <p style="color:var(--text-soft);font-size:12px;margin:0 0 22px;">Versi Anda: v${escHtml(APP_VERSION)} · Versi minimum: v${escHtml(versionGate.minVersion)}</p>
      <a href="${escHtml(versionGate.downloadUrl)}" target="_blank" rel="noopener" class="btn btn-primary" style="width:100%;padding:12px;text-decoration:none;">${iconDownload()} Unduh Pembaruan Sekarang</a>
    </div>
  </div>`;
}
function showUpdateBanner(latestVersion, downloadUrl){
  if(document.getElementById('update-banner')) return;
  const bar = document.createElement('div');
  bar.id = 'update-banner';
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:200;background:var(--maroon);color:#fff;padding:10px 18px;font-size:13px;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 -4px 14px rgba(0,0,0,.2);';
  bar.innerHTML = `<span>Versi baru tersedia: <strong>v${escHtml(latestVersion)}</strong> (versi Anda saat ini: v${escHtml(APP_VERSION)}).</span>
    <a href="${escHtml(downloadUrl)}" target="_blank" rel="noopener" class="btn btn-gold btn-sm" style="text-decoration:none;">${iconDownload()} Unduh Pembaruan</a>
    <button id="dismiss-update" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 12px;border-radius:5px;font-size:12px;cursor:pointer;">Tutup</button>`;
  document.body.appendChild(bar);
  document.getElementById('dismiss-update').addEventListener('click', ()=>bar.remove());
}

/* ===================== GLOBAL STATE ===================== */
const state = {
  user: null,        // {uid, nama, email, role, sekolahId, kelasId, nis, mapelIds}
  sekolahData: null,
  loginRole: 'admin_utama',
  tab: null,
  loading: true,
  cache: {},
};

const ROLES = {
  admin_utama:   { label: 'Admin Utama',    icon: iconCrown(),  color: '#6B1E23' },
  admin_sekolah: { label: 'Admin Sekolah',  icon: iconSchool(), color: '#1C2541' },
  guru:          { label: 'Guru Mapel',     icon: iconBook(),   color: '#3C6E47' },
  wali_kelas:    { label: 'Wali Kelas',     icon: iconUsers(),  color: '#B3872F' },
  siswa:         { label: 'Siswa',          icon: iconStudent(),color: '#2B3A63' },
};

function iconCrown(){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/></svg>`;}
function iconSchool(){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M5 10.5V16c0 1.1 3.1 3 7 3s7-1.9 7-3v-5.5"/></svg>`;}
function iconBook(){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>`;}
function iconUsers(){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`;}
function iconStudent(){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>`;}
function iconLogout(){return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`;}
function iconPlus(){return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;}

function toast(msg, type='ok'){
  const t = document.createElement('div');
  t.className = 'toast ' + (type==='ok'?'ok':'err');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300);}, 2600);
}

/* Bungkus operasi tulis ke database supaya kegagalan (rules menolak, koneksi putus)
   selalu memunculkan pesan yang bisa dibaca pengguna, bukan gagal diam-diam. */
async function simpanAman(fn, pesanSukses){
  try{
    await fn();
    if(pesanSukses) toast(pesanSukses);
    return true;
  }catch(e){
    console.error(e);
    toast(pesanGagalSimpan(e), 'err');
    return false;
  }
}
/* Pesan kegagalan penyimpanan yang bisa dipahami pengguna non-teknis. */
function pesanGagalSimpan(e){
  const kode = String((e && (e.code || e.message)) || e || '');
  if(/permission[_ ]denied/i.test(kode)){
    return 'Gagal menyimpan: akun ini tidak diizinkan mengubah data tersebut oleh aturan keamanan Firebase (permission denied).';
  }
  if(/network|offline|disconnect/i.test(kode)){
    return 'Gagal menyimpan: koneksi ke server terputus. Periksa jaringan lalu coba lagi.';
  }
  return 'Gagal menyimpan: ' + ((e && e.message) || kode || 'penyebab tidak diketahui');
}

function closeModal(){
  const m = el('modal-root');
  if(m) m.remove();
}
function openModal(html){
  closeModal();
  const wrap = document.createElement('div');
  wrap.id = 'modal-root';
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal-box fade-in">${html}</div>`;
  wrap.addEventListener('mousedown', (e)=>{ if(e.target===wrap) closeModal(); });
  document.body.appendChild(wrap);
}

function fmtDate(ts){
  if(!ts) return '-';
  const d = new Date(ts);
  return d.toLocaleDateString('id-ID', {day:'2-digit',month:'long',year:'numeric'});
}
function defaultTempatTanggal(){
  const alamat = state.sekolahData?.alamat || '';
  const kota = alamat.split(',')[0].trim();
  return (kota? kota+', ' : '') + fmtDate(Date.now());
}
function semesterLabel(semester){

/* Semester aktif sekolah, selalu dinormalkan menjadi string '1' atau '2'
   (di database bisa tersimpan sebagai angka 2 atau kosong). */

/* Semester yang sedang dilihat pengguna. Dipakai BERSAMA oleh Input Nilai, Rekap,
   Rapor Wali Kelas, dan Rapor Siswa, sehingga nilai yang diinput pada Semester 2
   langsung muncul di halaman rapor tanpa harus menunggu Admin Sekolah mengganti
   "Semester Aktif" sekolah. Bawaan: semester aktif sekolah. */
function getSemesterView(){
  const aktif = semesterAktifSekolah();

  const masihBerlaku = (state.semesterView==='1' || state.semesterView==='2') && state.semesterViewFor===aktif;

// Urutkan entri mapel berdasarkan field "urutan" (angka).
// Mapel tanpa "urutan" ditaruh di akhir, urut sesuai nama.
function sortedMapel(mapel){
  return Object.entries(mapel||{}).sort((a,b)=>{
    const ua = a[1]?.urutan, ub = b[1]?.urutan;
    const na = (typeof ua==='number'), nb = (typeof ub==='number');
    if(na && nb) return ua-ub;
    if(na) return -1;
    if(nb) return 1;
    return (a[1]?.nama||'').localeCompare(b[1]?.nama||'');
  });
}
function escHtml(str){
  return String(str??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Bulatkan nilai ke bilangan bulat terdekat (untuk nilai lama yang masih berkoma).
function bulat(v){ return (typeof v==='number' && isFinite(v)) ? Math.round(v) : v; }

/* ===================== AUTH FLOW ===================== */
/* Saat Admin Utama pertama dibuat, akun sudah masuk sebelum profilnya sempat ditulis.
   Flag ini menahan pemeriksaan peran supaya pengguna tidak langsung ditendang keluar. */
let sedangMembuatAkunSendiri = false;
async function handleAuthUser(fbUser){
  if(sedangMembuatAkunSendiri) return;
  if(fbUser){
    try{
      const snap = await db.ref('users/'+fbUser.uid).once('value');
      const profile = snap.val();
      const availableRoles = profile ? Object.keys(profile.roles||{}).filter(r=>profile.roles[r]) : [];
      if(!profile || availableRoles.length===0){
        toast('Akun tidak memiliki profil data/peran. Hubungi admin.', 'err');
        await auth.signOut();
        state.user = null;
      } else {
        state.user = Object.assign({uid: fbUser.uid, email: fbUser.email}, profile);
        state.tab = null;
        state.semesterView = null;
        const saved = getSavedActiveRole(fbUser.uid);
        state.user.activeRole = (saved && availableRoles.includes(saved)) ? saved : availableRoles[0];
        setActiveRole(fbUser.uid, state.user.activeRole);
        if(state.user.sekolahId){
          const sSnap = await db.ref('sekolah/'+state.user.sekolahId).once('value');
          state.sekolahData = sSnap.val();
        }
      }
    } catch(e){
      console.error(e);
      toast('Gagal memuat data pengguna.', 'err');
    }
  } else {
    state.user = null;
    state.sekolahData = null;
  }
  state.loading = false;
  render();
}
auth.onAuthStateChanged(handleAuthUser);

async function doLogin(email, password, expectedRole){
  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const snap = await db.ref('users/'+cred.user.uid).once('value');
    const profile = snap.val();
    if(!profile || !profile.roles || !profile.roles[expectedRole]){
      await auth.signOut();
      toast('Email/kata sandi benar, namun akun ini tidak memiliki peran "'+ROLES[expectedRole].label+'".', 'err');
      return;
    }
    if(profile.status === 'pending'){
      await auth.signOut();
      toast('Akun Anda masih menunggu aktivasi oleh Admin Utama.', 'err');
      return;
    }
    if(profile.status === 'nonaktif' || profile.status === 'ditolak'){
      await auth.signOut();
      toast('Akun Anda tidak aktif. Silakan hubungi Admin Utama.', 'err');
      return;
    }
    setActiveRole(cred.user.uid, expectedRole);
  } catch(e){
    toast(friendlyAuthError(e), 'err');
  }
}
function friendlyAuthError(e){
  const map = {
    'auth/invalid-email':'Format email tidak valid.',
    'auth/user-not-found':'Akun tidak ditemukan.',
    'auth/wrong-password':'Kata sandi salah.',
    'auth/invalid-credential':'Email atau kata sandi salah.',
    'auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti.',
    'auth/email-already-in-use':'Email sudah terdaftar.',
    'auth/weak-password':'Kata sandi minimal 6 karakter.',
  };
  return map[e.code] || ('Terjadi kesalahan: ' + e.message);
}
async function doLogout(){
  await auth.signOut();
  toast('Anda telah keluar.');
}

/* Create a user (auth + db) without switching current admin session, via secondary app instance */
/* Menyusun field bantu "sekolahId_kelasId" (dipakai sebagai indeks query pada Rules)
   supaya Guru Mapel / Wali Kelas bisa membaca daftar siswa satu kelas TANPA perlu
   izin baca ke seluruh node "users" lintas sekolah. Wajib disertakan setiap kali
   kelasId seorang pengguna ditulis atau dihapus. */
function kelasIndexPatch(sekolahId, kelasId){
  return { sekolahId_kelasId: (sekolahId && kelasId) ? (sekolahId + '_' + kelasId) : null };
}
async function createManagedUser({nama, email, password, roles, extra}){
  let newUid, recovered = false;
  try{
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    newUid = cred.user.uid;
  }catch(e){
    if(e.code === 'auth/email-already-in-use'){
      // Mungkin ini akun "yatim": akun login sempat terbuat sebelumnya tapi data profilnya
      // gagal tersimpan (mis. karena error lain saat itu). Coba masuk dengan kata sandi yang
      // sama dari CSV/form ini — kalau cocok, berarti memang akun yang sama dan bisa dilengkapi.
      try{
        const cred2 = await secondaryAuth.signInWithEmailAndPassword(email, password);
        newUid = cred2.user.uid;
        recovered = true;
      }catch(e2){
        try{ await secondaryAuth.signOut(); }catch(_){}
        throw new Error('Email "'+email+'" sudah terdaftar di sistem dengan kata sandi yang berbeda dari yang Anda masukkan. Gunakan email lain, atau reset kata sandi akun tersebut lebih dulu.');
      }
    } else {
      throw e;
    }
  }
  await secondaryAuth.signOut();
  if(recovered){
    const existing = await db.ref('users/'+newUid).once('value');
    if(existing.exists()){
      throw new Error('Email "'+email+'" sudah terdaftar dan datanya sudah lengkap di sistem. Tidak ada perubahan dilakukan.');
    }
  }
  const payload = Object.assign({ nama, email, roles, status:'aktif', createdAt: Date.now() }, extra||{});
  Object.assign(payload, kelasIndexPatch(payload.sekolahId, payload.kelasId));
  await db.ref('users/'+newUid).set(payload);
  return newUid;
}

/* ===================== IMPORT FILE (CSV) — SISWA & GURU ===================== */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, ''); // buang BOM jika ada (sering muncul dari file Excel)
  const lines = text.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(l=>l.length);
  if(!lines.length) return {header:[], rows:[]};
  // deteksi otomatis pemisah: koma (,) atau titik-koma (;) — Excel di regional Indonesia
  // biasanya menyimpan CSV dengan titik-koma karena koma dipakai sebagai desimal.
  const firstLine = lines[0];
  const commaCount = (firstLine.match(/,/g)||[]).length;
  const semicolonCount = (firstLine.match(/;/g)||[]).length;
  const delim = semicolonCount > commaCount ? ';' : ',';
  const splitLine = l => {
    // parser sederhana yang tetap menghormati tanda kutip di sekitar nilai
    const out = []; let cur=''; let inQuotes=false;
    for(let i=0;i<l.length;i++){
      const c = l[i];
      if(c==='"'){ inQuotes = !inQuotes; continue; }
      if(c===delim && !inQuotes){ out.push(cur.trim()); cur=''; continue; }
      cur += c;
    }
    out.push(cur.trim());
    return out;
  };
  const header = splitLine(lines[0]).map(h=>h.toLowerCase());
  const rows = lines.slice(1).map(l=>{
    const cols = splitLine(l);
    const obj = {};
    header.forEach((h,i)=> obj[h] = (cols[i]||'').trim());
    return obj;
  });
  return {header, rows};
}
function downloadTextFile(filename, content){
  const blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
}
function renderImportSummary(container, results){
  const ok = results.filter(r=>r.ok).length, fail = results.length - ok;
  container.innerHTML = `
    <div style="font-size:13.5px;margin-bottom:10px;">
      <span style="color:var(--good);font-weight:600;">${ok} berhasil</span>${fail? ` · <span style="color:var(--bad);font-weight:600;">${fail} gagal</span>`:''}
    </div>
    ${fail? `<div class="card scroll-x" style="max-height:180px;overflow-y:auto;">
      <table class="ledger"><thead><tr><th>Baris</th><th>Keterangan</th></tr></thead>
      <tbody>${results.filter(r=>!r.ok).map(r=>`<tr><td>${escHtml(r.label)}</td><td style="color:var(--bad);">${escHtml(r.msg)}</td></tr>`).join('')}</tbody>
      </table></div>` : ''}`;
}

/* Import Siswa dari file CSV. Kolom: nis,nama,email,password,kelas (nama kelas harus sama persis) */
function openImportSiswaModal(sid, kelas, onDone){
  openModal(`
    <div style="padding:26px;">
      <h3 style="margin:0 0 6px;font-size:17px;">Import Data Siswa</h3>
      <p style="color:var(--text-soft);font-size:12.5px;margin:0 0 16px;line-height:1.6;">
        Unggah file CSV dengan kolom: <strong>nis, nama, email, password, kelas</strong>. Nilai kolom "kelas" harus sama persis dengan nama kelas yang sudah terdaftar.
      </p>
      <button id="dl-template-s" class="btn btn-outline btn-sm" style="margin-bottom:14px;">${iconDownload()} Unduh Template CSV</button>
      <input type="file" id="f-file" accept=".csv,text/csv" class="box-input">
      <div id="import-preview" style="margin-top:14px;"></div>
      <div class="modal-footer-sticky">
        <button class="btn btn-outline btn-sm" onclick="closeModal()">Tutup</button>
        <button class="btn btn-primary btn-sm" id="proses-import-s" disabled>Proses Import</button>
      </div>
    </div>`);
  el('dl-template-s').addEventListener('click', ()=> downloadTextFile('template-siswa.csv', 'nis,nama,email,password,kelas\n1001,Contoh Nama,contoh@sekolah.sch.id,rahasia123,'+(Object.values(kelas)[0]?.nama||'7A')));
  let parsedRows = [];
  el('f-file').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    el('proses-import-s').disabled = true;
    if(!file) return;
    const text = await file.text();
    const {rows} = parseCSV(text);
    parsedRows = rows;
    el('import-preview').innerHTML = rows.length?
      `<p style="font-size:12.5px;color:var(--text-soft);">${rows.length} baris siap diimpor.</p>` :
      `<p style="font-size:12.5px;color:var(--bad);">Tidak ada baris data yang terbaca.</p>`;
    el('proses-import-s').disabled = !rows.length;
  });
  el('proses-import-s').addEventListener('click', async ()=>{
    el('proses-import-s').disabled = true;
    el('proses-import-s').textContent = 'Memproses...';
    const kelasByName = {}; Object.entries(kelas).forEach(([id,k])=> kelasByName[(k.nama||'').toLowerCase()] = id);
    const results = [];
    for(let i=0;i<parsedRows.length;i++){
      const row = parsedRows[i];
      const label = 'Baris '+(i+2)+' ('+(row.nama||row.email||'-')+')';
      try{
        const missing = [];
        if(!row.nama) missing.push('nama');
        if(!row.email) missing.push('email');
        if(!row.password) missing.push('password');
        if(missing.length) throw new Error('Kolom kosong: '+missing.join(', ')+' (cek apakah file CSV memakai pemisah koma/titik-koma dengan benar)');
        if(row.password.length<6) throw new Error('Kata sandi minimal 6 karakter');
        const kelasId = row.kelas ? kelasByName[row.kelas.toLowerCase()] : null;
        if(row.kelas && !kelasId) throw new Error('Nama kelas "'+row.kelas+'" tidak ditemukan');
        await createManagedUser({nama:row.nama, email:row.email, password:row.password, roles:{siswa:true}, extra:{sekolahId:sid, kelasId: kelasId||null, nis: row.nis||''}});
        results.push({ok:true, label});
      } catch(e){ results.push({ok:false, label, msg: e.code ? friendlyAuthError(e) : e.message}); }
    }
    el('proses-import-s').textContent = 'Proses Import';
    renderImportSummary(el('import-preview'), results);
    toast(results.filter(r=>r.ok).length+' siswa berhasil diimpor.');
    if(onDone) onDone();
  });
}

/* Jaring pengaman terakhir: operasi async yang gagal tanpa try/catch tetap
   memunculkan pesan, bukan menghilang diam-diam di konsol. */
window.addEventListener('unhandledrejection', (ev)=>{
  const err = ev.reason;
  if(!err) return;
  console.error('Operasi gagal:', err);
  try{ toast(describeDbError(err), 'err'); }catch(_){}
});

/* Pendaftaran memakai instance "Secondary" (auth + database), bukan instance utama.
   Kalau memakai instance utama, listener onAuthStateChanged ikut terpicu begitu akun
   terbuat, membaca profil yang belum sempat ditulis, lalu memanggil signOut() di tengah
   jalan — akibatnya penulisan users/ dan pendaftaran/ ditolak dan akun jadi "yatim".
   Dengan instance sekunder, penulisan berjalan atas nama akun baru itu sendiri dan sesi
   di tab utama tidak tersentuh sama sekali. */
async function registerAdminSekolah({namaSekolah, npsn, alamatSekolah, namaAdmin, email, password}){
  const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
  const newUid = cred.user.uid;
  try{
    await secondaryDb.ref('users/'+newUid).set({
      nama: namaAdmin, email, roles:{admin_sekolah:true}, status:'pending', createdAt: Date.now()
    });
    await secondaryDb.ref('pendaftaran/'+newUid).set({
      namaSekolah, npsn, alamatSekolah, namaAdmin, email, status:'pending', createdAt: Date.now()
    });
    try{ await cred.user.sendEmailVerification(); }catch(e){ /* opsional, abaikan jika gagal */ }
  } finally {
    try{ await secondaryAuth.signOut(); }catch(e){}
  }
}

    if(!nama||!email||pass.length<6){ toast('Lengkapi semua bidang, kata sandi min 6 karakter.','err'); return; }
    try{
      const already = await db.ref('meta/adminUtamaCreated').once('value');
      if(already.val()){ toast('Admin Utama sudah pernah dibuat.','err'); closeModal(); return; }
      // Tahan pemeriksaan peran: akun sudah "masuk" sebelum profilnya tertulis.
      sedangMembuatAkunSendiri = true;
      let cred;
      try{
        cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.ref('users/'+cred.user.uid).set({ nama, email, roles:{admin_utama:true}, status:'aktif', createdAt: Date.now() });
        await db.ref('meta/adminUtamaCreated').set(true);
        setupAdminExists = true;
      } finally {
        sedangMembuatAkunSendiri = false;
      }
      toast('Admin Utama berhasil dibuat. Anda kini masuk.');
      closeModal();
      // Profil sudah ada, baru jalankan pemeriksaan peran & render dashboard.
      await handleAuthUser(auth.currentUser);
    } catch(e){
      console.error(e);
      // Bersihkan sesi setengah jadi agar tidak tersangkut di layar kosong.
      try{ if(auth.currentUser) await auth.signOut(); }catch(_){}
      toast(friendlyAuthError(e),'err');
    }
  });
}

/* Grafik batang horizontal sederhana. items: [{label, value, color?}] */
function barListChart(items, opts){
  opts = opts || {};
  const unit = opts.unit || '';
  const max = opts.max || Math.max(1, ...items.map(i=>Number(i.value)||0));
  if(!items.length) return `<p style="color:var(--text-soft);font-size:13px;margin:0;">Belum ada data untuk ditampilkan.</p>`;
  return `<div style="display:flex;flex-direction:column;gap:12px;">
    ${items.map(i=>{
      const val = Number(i.value)||0;
      const pct = Math.max(val>0?3:0, Math.round((val/max)*100));
      return `<div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;gap:10px;">
          <span style="color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(i.label)}</span>
          <span style="font-weight:700;flex-shrink:0;">${val}${unit}</span>
        </div>
        <div style="background:var(--bg);border-radius:5px;height:10px;overflow:hidden;border:1px solid var(--border);">
          <div style="width:${pct}%;height:100%;background:${i.color||'var(--maroon)'};border-radius:5px;"></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
/* Bar progres tunggal, mis. "12/20 (60%)" */
function progressBar(value, max, label, color){
  const v = Number(value)||0, m = Number(max)||0;
  const pct = m>0? Math.round((v/m)*100) : 0;
  return `<div>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;gap:10px;">
      <span style="color:var(--text-soft);">${escHtml(label)}</span>
      <span style="font-weight:700;flex-shrink:0;">${v}/${m} (${pct}%)</span>
    </div>
    <div style="background:var(--bg);border-radius:6px;height:12px;overflow:hidden;border:1px solid var(--border);">
      <div style="width:${pct}%;height:100%;background:${color||'var(--good)'};border-radius:6px;transition:width .3s ease;"></div>
    </div>
  </div>`;
}
/* Bungkus judul + isi grafik/progres dalam kartu, dipakai berulang di semua dashboard */
function chartCard(title, innerHtml){
  return `<div class="card" style="padding:20px 22px;">
    <h3 style="font-size:14.5px;margin:0 0 16px;">${title}</h3>
    ${innerHtml}
  </div>`;
}

          <td>${escHtml(p.namaAdmin)}</td>

            <button class="btn btn-primary btn-sm approve-reg" data-id="${id}">Aktifkan</button>
            <button class="btn btn-danger btn-sm reject-reg" data-id="${id}">Tolak</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-soft);">Tidak ada pendaftaran menunggu.</td></tr>`}
      </tbody>
    </table>`;

  const histWrap = document.createElement('div');
  histWrap.className = 'card scroll-x';
  histWrap.innerHTML = `
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-soft);">RIWAYAT PENDAFTARAN</div>
    <table class="ledger">
      <thead><tr><th>Nama Sekolah</th><th>Penanggung Jawab</th><th>Email</th><th>Status</th></tr></thead>

        <td>${p.status==='approved'? '<span class="badge" style="background:#DCEBDF;color:#2C5334;">Disetujui</span>' : '<span class="badge" style="background:#F6DCD9;color:#8A2E24;">Ditolak</span>'}</td></tr>`).join('') :

      </tbody>

  target.appendChild(histWrap);

    const id = b.dataset.id; const p = data[id];
    if(!confirm(`Aktifkan sekolah "${p.namaSekolah}" dan akun "${p.namaAdmin}"?`)) return;
    b.disabled = true;
    const ok = await simpanAman(async ()=>{

    renderAUSekolah(el('main-content'));

        <h3 style="margin:0 0 16px;font-size:17px;">Tambah Admin Sekolah</h3>
        <div style="display:flex;flex-direction:column;gap:12px;">

          <select id="f-sekolah" class="box-input">
            ${Object.entries(sekolah).map(([id,s])=>`<option value="${escHtml(id)}">${escHtml(s.nama)}</option>`).join('')}

          <button class="btn btn-primary btn-sm" id="save-admin">Buat Akun</button>
        </div>
      </div>`);
    el('save-admin').addEventListener('click', async ()=>{
      const nama = el('f-nama').value.trim(), email = el('f-email').value.trim(), pass = el('f-pass').value;
      const sekolahId = el('f-sekolah').value;
      if(!nama||!email||pass.length<6){ toast('Lengkapi data, kata sandi min 6 karakter.','err'); return; }
      try{
        await createManagedUser({nama, email, password: pass, roles:{admin_sekolah:true}, extra:{sekolahId}});
        toast('Admin Sekolah berhasil dibuat.'); closeModal();
        renderAUAdminSekolah(el('main-content'));
      } catch(e){ toast(friendlyAuthError(e),'err'); }
    });
  });
  wrap.querySelectorAll('.del-admin').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Hapus data admin ini? (akun login tetap ada, hanya profil dihapus)')){
      const ok = await simpanAman(()=> db.ref('users/'+b.dataset.id).remove(), 'Admin dinonaktifkan.');
      if(ok) renderAUAdminSekolah(target);
    }
  }));
}

  const sid = state.user.sekolahId;
  if(!sid){ target.innerHTML = `<div class="card" style="padding:24px;">Akun ini belum terhubung ke sekolah manapun.</div>`; return; }
  if(tab==='overview') return renderASOverview(target, sid);
  if(tab==='data_sekolah') return renderASDataSekolah(target, sid);
  if(tab==='kepsek') return renderASKepsek(target, sid);
  if(tab==='kelas') return renderASKelas(target, sid);
  if(tab==='mapel') return renderASMapel(target, sid);
  if(tab==='guru') return renderASGuru(target, sid);

    if(sudahPernahDiatur && (ta !== taLama || sem !== semLama)){
      const yakin = confirm('Tahun Ajaran/Semester aktif akan diubah menjadi ' + (ta||'-') + ' — Semester ' + sem +

      tahunAjaranAktif: ta, semesterAktif: sem };

    if(!ok) return;
    state.sekolahData = Object.assign({}, state.sekolahData, payload);
    state.semesterView = null;
    renderASDataSekolah(el('main-content'), sid);
  });
}

async function renderASKelas(target, sid){
  const [kSnap, uSnap] = await Promise.all([db.ref('kelas/'+sid).once('value'), db.ref('users').orderByChild('sekolahId').equalTo(sid).once('value')]);
  const kelas = kSnap.val() || {};
  const users = uSnap.val() || {};
  const waliList = Object.entries(users).filter(([id,u])=>u.sekolahId===sid && u.roles && u.roles.wali_kelas);
  // Perbaikan otomatis (backfill) untuk kelas lama: sebelumnya nama wali kelas hanya disimpan
  // sebagai referensi (waliKelasUid) dan dibaca ulang dari node "users" saat mencetak rapor —
  // ini gagal untuk akun siswa karena aturan keamanan Firebase menolak siswa membaca profil
  // pengguna lain. Di sini (sesi Admin Sekolah, yang pasti punya izin) nama & NIP wali kelas
  // disalin langsung ke data kelas jika belum ada, agar rapor siswa tidak lagi kosong.
  Object.entries(kelas).forEach(([id,k])=>{
    if(k.waliKelasUid && !k.waliKelasNama){
      const w = users[k.waliKelasUid];
      if(w && w.nama){
        db.ref('kelas/'+sid+'/'+id).update({ waliKelasNama: w.nama, waliKelasNip: w.nip||null })
          .catch(e=>console.error('Gagal backfill wali kelas:', e));
      }
    }
  });
  target.innerHTML = pageHeader('Data Kelas', 'Kelola rombongan belajar dan wali kelas.',
    `<button id="add-kelas" class="btn btn-primary btn-sm">${iconPlus()} Tambah Kelas</button>`);
  const wrap = document.createElement('div'); wrap.className='card scroll-x';
  wrap.innerHTML = `
    <table class="ledger">
      <thead><tr><th>Nama Kelas</th><th>Tingkat</th><th>Wali Kelas</th><th></th></tr></thead>
      <tbody>
      ${Object.keys(kelas).length? Object.entries(kelas).map(([id,k])=>`
        <tr>
          <td style="font-weight:600;">${escHtml(k.nama)}</td>
          <td>${escHtml(k.tingkat||'-')}</td>
          <td>${users[k.waliKelasUid]?.nama ? escHtml(users[k.waliKelasUid].nama) : '<span style="color:var(--text-soft)">Belum ditentukan</span>'}</td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="btn btn-outline btn-sm edit-k" data-id="${id}">${iconEdit()}</button>
            <button class="btn btn-danger btn-sm del-k" data-id="${id}">${iconTrash()}</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-soft);">Belum ada kelas.</td></tr>`}
      </tbody>
    </table>`;
  target.appendChild(wrap);

  function formKelas(id, data){
    data = data || {};
    openModal(`
      <div style="padding:26px;">
        <h3 style="margin:0 0 16px;font-size:17px;">${id?'Ubah':'Tambah'} Kelas</h3>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <input id="f-nama" class="box-input" placeholder="Nama kelas (mis. 7A)" value="${escHtml(data.nama||'')}">
          <input id="f-tingkat" class="box-input" placeholder="Tingkat (mis. 7)" value="${escHtml(data.tingkat||'')}">
          <select id="f-wali" class="box-input">
            <option value="">— Pilih Wali Kelas —</option>
            ${waliList.map(([id2,u])=>`<option value="${escHtml(id2)}" ${data.waliKelasUid===id2?'selected':''}>${escHtml(u.nama)}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">
          <button class="btn btn-outline btn-sm" onclick="closeModal()">Batal</button>
          <button class="btn btn-primary btn-sm" id="save-k">Simpan</button>
        </div>
      </div>`);
    el('save-k').addEventListener('click', async ()=>{
      const nama = el('f-nama').value.trim();
      if(!nama){ toast('Nama kelas wajib diisi.','err'); return; }
      const waliUid = el('f-wali').value || null;
      // Nama & NIP wali kelas disalin (denormalisasi) ke data kelas agar rapor tetap
      // menampilkan tanda tangan wali kelas walau siswa tidak diizinkan membaca node "users" lain.
      const waliUser = waliUid ? (users[waliUid] || {}) : null;
      const payload = {
        nama, tingkat: el('f-tingkat').value.trim(), waliKelasUid: waliUid,
        waliKelasNama: waliUser ? (waliUser.nama || null) : null,
        waliKelasNip: waliUser ? (waliUser.nip || null) : null,
      };
      const refId = id || uid();
      const waliLama = data.waliKelasUid || null;
      const ok = await simpanAman(async ()=>{
        await db.ref('kelas/'+sid+'/'+refId).update(payload);
        // Lepas kelas dari wali lama bila diganti, supaya ia tidak lagi bisa membuka
        // rekap nilai / mengunci rapor kelas yang bukan tanggung jawabnya.
        if(waliLama && waliLama !== payload.waliKelasUid){
          await db.ref('users/'+waliLama).update(Object.assign({kelasId: null}, kelasIndexPatch(null, null)));
        }
        if(payload.waliKelasUid) await db.ref('users/'+payload.waliKelasUid).update(Object.assign({kelasId: refId}, kelasIndexPatch(sid, refId)));
      }, 'Kelas tersimpan.');
      if(!ok) return;
      closeModal(); renderASKelas(el('main-content'), sid);
    });
  }
  el('add-kelas').addEventListener('click', ()=>formKelas());
  wrap.querySelectorAll('.edit-k').forEach(b=>b.addEventListener('click', ()=>formKelas(b.dataset.id, kelas[b.dataset.id])));
  wrap.querySelectorAll('.del-k').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Hapus kelas ini?')) return;
    const kid = b.dataset.id;
    const ok = await simpanAman(async ()=>{
      await db.ref('kelas/'+sid+'/'+kid).remove();
      // Bersihkan referensi kelas yang sudah tidak ada dari profil wali & siswa,
      // agar dashboard mereka tidak menunjuk "kelas hantu".
      const terkait = Object.entries(users).filter(([uidUser,u])=> u.sekolahId===sid && sameId(u.kelasId, kid));
      for(const [uidUser] of terkait){
        await db.ref('users/'+uidUser).update(Object.assign({kelasId: null}, kelasIndexPatch(null, null)));
      }
    }, 'Kelas dihapus.');
    if(ok) renderASKelas(target, sid);
  }));
}

async function renderASMapel(target, sid){
  const snap = await db.ref('mapel/'+sid).once('value');
  const mapel = snap.val() || {};
  function nextUrutan(){
    const vals = Object.values(mapel).map(m=>Number(m.urutan)||0);
    return vals.length? Math.max(...vals)+1 : 1;
  }
  target.innerHTML = pageHeader('Mata Pelajaran', 'Daftar mata pelajaran di sekolah ini.',
    `<button id="add-m" class="btn btn-primary btn-sm">${iconPlus()} Tambah Mapel</button>`);

    <table class="ledger">
      <thead><tr><th>Urutan</th><th>Nama Mata Pelajaran</th><th>KKM</th><th></th></tr></thead>
      <tbody>
      ${Object.keys(mapel).length? sortedMapel(mapel).map(([id,m])=>`
        <tr><td>${escHtml(m.urutan??'-')}</td><td style="font-weight:600;">${escHtml(m.nama)}</td><td>${escHtml(m.kkm||'-')}</td>
        <td style="text-align:right;white-space:nowrap;">
          <button class="btn btn-outline btn-sm edit-m" data-id="${id}">${iconEdit()}</button>
          <button class="btn btn-danger btn-sm del-m" data-id="${id}">${iconTrash()}</button>
        </td></tr>`).join('') : `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-soft);">Belum ada mata pelajaran.</td></tr>`}
      </tbody>
    </table>`;
  target.appendChild(wrap);
  function formMapel(id, data){
    data = data||{};
    openModal(`
      <div style="padding:26px;">
        <h3 style="margin:0 0 16px;font-size:17px;">${id?'Ubah':'Tambah'} Mata Pelajaran</h3>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <input id="f-urutan" type="number" class="box-input" placeholder="Urutan cetak di rapor (mis. 1)" value="${data.urutan??(id?'':nextUrutan())}">
          <input id="f-nama" class="box-input" placeholder="Nama mata pelajaran" value="${escHtml(data.nama||'')}">
          <input id="f-kkm" type="number" class="box-input" placeholder="KKM (mis. 75)" value="${data.kkm||''}">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">
          <button class="btn btn-outline btn-sm" onclick="closeModal()">Batal</button>
          <button class="btn btn-primary btn-sm" id="save-m">Simpan</button>
        </div>
      </div>`);
    el('save-m').addEventListener('click', async ()=>{
      const nama = el('f-nama').value.trim();
      if(!nama){ toast('Nama wajib diisi.','err'); return; }
      const refId = id || uid();
      try{
        await db.ref('mapel/'+sid+'/'+refId).update({nama, kkm: Number(el('f-kkm').value)||75, urutan: Number(el('f-urutan').value)||0});
        toast('Mapel tersimpan.'); closeModal(); renderASMapel(el('main-content'), sid);
      }catch(e){
        toast(e.code==='PERMISSION_DENIED' ? 'Gagal menyimpan: akun ini tidak diizinkan mengubah data mata pelajaran (cek Firebase Rules).' : 'Gagal menyimpan: '+e.message, 'err');
      }
    });
  }
  el('add-m').addEventListener('click', ()=>formMapel());
  wrap.querySelectorAll('.edit-m').forEach(b=>b.addEventListener('click', ()=>formMapel(b.dataset.id, mapel[b.dataset.id])));
  wrap.querySelectorAll('.del-m').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Hapus mata pelajaran ini?')){
      try{
        await db.ref('mapel/'+sid+'/'+b.dataset.id).remove();
        toast('Mapel dihapus.'); renderASMapel(target, sid);
      }catch(e){
        toast(e.code==='PERMISSION_DENIED' ? 'Gagal menghapus: akun ini tidak diizinkan menghapus data mata pelajaran (cek Firebase Rules).' : 'Gagal menghapus: '+e.message, 'err');
      }
    }
  }));
}

/* ===================== HELPER: AMBIL SISWA PER KELAS ===================== */
/* Dipakai oleh Guru Mapel dan Wali Kelas. Query dibatasi pada field gabungan
   "sekolahId_kelasId" (bukan "kelasId" saja) supaya Firebase Rules bisa memastikan
   guru/wali hanya membaca data sekolahnya sendiri — bukan seluruh node "users"
   lintas sekolah. Tidak ada lagi fallback ke pembacaan penuh /users: kalau query
   ini ditolak, itu memang seharusnya ditolak (akun tsb bukan bagian sekolah ini). */
function sortSiswaList(list){
  return list.sort((a,b)=> String(a[1].nama||'').localeCompare(String(b[1].nama||''), 'id'));
}
function sameId(a,b){ return String(a==null?'':a).trim() === String(b==null?'':b).trim(); }
async function fetchSiswaByKelas(sid, kelasId){
  if(!kelasId) return [];
  const cocok = (u)=> u && u.roles && u.roles.siswa
    && sameId(u.sekolahId, sid) && sameId(u.kelasId, kelasId)
    && u.status !== 'nonaktif';
  const snap = await db.ref('users').orderByChild('sekolahId_kelasId').equalTo(sid+'_'+kelasId).once('value');
  return sortSiswaList(Object.entries(snap.val()||{}).filter(([id,u])=>cocok(u)));
}
function describeDbError(e){
  const msg = String((e && (e.message || e.code)) || e || '');
  if(/permission[_ ]denied/i.test(msg)){
    return 'Akses ditolak oleh aturan keamanan Firebase (permission denied) ketika membaca data pengguna. '
      + 'Perbarui Realtime Database Rules pada node "users" agar Admin Sekolah boleh membaca dengan '
      + 'query orderByChild("sekolahId"), dan Guru/Wali Kelas boleh membaca dengan query '
      + 'orderByChild("sekolahId_kelasId") — masing-masing dibatasi pada sekolahId akun yang login.';
  }
  if(/index not defined|indexOn/i.test(msg)){
    return 'Firebase meminta indeks pada node "users". Tambahkan ".indexOn": ["sekolahId", "sekolahId_kelasId", "email"] '
      + 'di dalam aturan node "users" pada Realtime Database Rules.';
  }
  return 'Gagal memuat data: ' + msg;
}
function errorCard(msg){
  return `<div class="card" style="padding:20px 22px;border-left:3px solid #8A2E24;">
    <div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#8A2E24;">Data tidak dapat dimuat</div>
    <div style="font-size:13px;color:var(--text-soft);line-height:1.75;">${escHtml(msg)}</div>
  </div>`;
}
function loadingCard(msg){
  return `<div class="card" style="padding:20px 22px;color:var(--text-soft);font-size:13.5px;">${escHtml(msg)}</div>`;
}

            const cp = buildCapaianText(capaianTeks, nv.nilaiAkhir, u);
            return `<tr data-siswa="${id}">
              <td>${escHtml(u.nis||'-')}</td>
              <td style="font-weight:600;">${escHtml(u.nama)}</td>
              <td><input type="number" min="0" max="100" class="box-input inp-tugas" style="width:70px;" value="${nv.tugas??''}"></td>
              <td><input type="number" min="0" max="100" class="box-input inp-uts" style="width:70px;" value="${nv.uts??''}"></td>
              <td><input type="number" min="0" max="100" class="box-input inp-uas" style="width:70px;" value="${nv.uas??''}"></td>
              <td class="td-akhir" style="font-weight:700;">${nv.nilaiAkhir!=null? bulat(nv.nilaiAkhir) : '-'}</td>
              <td class="td-predikat">${nv.predikat? predikatBadge(nv.predikat) : '-'}</td>
              <td class="td-cp" style="min-width:190px;max-width:240px;">
                <div class="cp-preview" style="font-size:12.5px;color:${cp.ok?'var(--text-soft)':'#8A2E24'};font-style:${cp.ok?'normal':'italic'};max-width:230px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;line-height:1.4;">${escHtml(cp.text)}</div>
              </td>
              <td><button class="btn btn-outline btn-sm save-row">Simpan</button></td>
            </tr>`;
          }).join('') : `<tr><td colspan="9" style="text-align:center;padding:22px;color:var(--text-soft);line-height:1.7;">Belum ada siswa terdaftar di kelas <strong>${escHtml(kelas[kid]?.nama||'-')}</strong>.<br>Minta Admin Sekolah menambahkan siswa dan memastikan kelasnya sudah dipilih pada data siswa.</td></tr>`}
          </tbody>
        </table>
      </div>
      ${siswaList.length? `<div style="margin-top:14px;"><button id="save-all" class="btn btn-primary btn-sm">Simpan Semua Nilai</button></div>`:''}
    `;
    // Baris dianggap kosong bila ketiga kolom nilai belum diisi sama sekali.
    function barisKosong(row){
      return ['.inp-tugas','.inp-uts','.inp-uas']
        .every(sel => String(row.querySelector(sel).value).trim() === '');
    }
    // Kembalikan pesan bila ada angka di luar rentang 0–100, atau null bila valid.
    function validasiBaris(row){
      const cek = [['.inp-tugas','Tugas'],['.inp-uts','UTS'],['.inp-uas','UAS']];
      for(const [sel, label] of cek){
        const raw = String(row.querySelector(sel).value).trim();
        if(raw === '') continue;
        const n = Number(raw);
        if(!isFinite(n) || n < 0 || n > 100) return 'Nilai ' + label + ' harus berupa angka 0–100.';
      }
      return null;
    }
    function computeAndSave(row){
      const t = parseFloat(row.querySelector('.inp-tugas').value)||0;
      const uts = parseFloat(row.querySelector('.inp-uts').value)||0;
      const uas = parseFloat(row.querySelector('.inp-uas').value)||0;
      const akhir = Math.round(t*0.3 + uts*0.3 + uas*0.4);
      const predikat = akhir>=90?'A':akhir>=80?'B':akhir>=kkm?'C':'D';
      row.querySelector('.td-akhir').textContent = akhir;
      row.querySelector('.td-predikat').innerHTML = predikatBadge(predikat);
      const siswaId = row.dataset.siswa;
      const u = siswaList.find(([sid2])=>sid2===siswaId)?.[1] || {};
      const cp = buildCapaianText(capaianTeks, akhir, u);
      const cpEl = row.querySelector('.cp-preview');
      cpEl.textContent = cp.text;
      cpEl.style.color = cp.ok? 'var(--text-soft)' : '#8A2E24';
      cpEl.style.fontStyle = cp.ok? 'normal' : 'italic';
      return {tugas:t, uts, uas, nilaiAkhir:akhir, predikat};
    }
    function refreshProgress(){
      const box = el('nilai-progress');
      if(!box) return;
      const done = tableTarget.querySelectorAll('tbody tr[data-siswa] .td-akhir').length -
        Array.from(tableTarget.querySelectorAll('tbody tr[data-siswa] .td-akhir')).filter(td=>td.textContent==='-').length;
      box.innerHTML = progressBar(done, siswaList.length, 'Siswa sudah dinilai');
    }
    tableTarget.querySelectorAll('.save-row').forEach(btn=>btn.addEventListener('click', async ()=>{
      const row = btn.closest('tr'); const siswaId = row.dataset.siswa;
      if(barisKosong(row)){ toast('Isi minimal satu kolom nilai sebelum menyimpan.','err'); return; }
      const pesanSalah = validasiBaris(row);
      if(pesanSalah){ toast(pesanSalah,'err'); return; }
      const payload = computeAndSave(row);
      btn.disabled = true;
      await simpanAman(()=> db.ref(`nilai/${sid}/${kid}/${mid}/${semester}/${siswaId}`).set(payload), 'Nilai tersimpan.');
      btn.disabled = false;
      refreshProgress();
    }));
    const saveAll = el('save-all');
    if(saveAll) saveAll.addEventListener('click', async ()=>{
      const updates = {};
      let jumlah = 0, pesanSalah = null;
      const baris = Array.from(tableTarget.querySelectorAll('tbody tr[data-siswa]'));
      for(const row of baris){
        // Baris yang belum diisi DILEWATI — sebelumnya kolom kosong dibaca sebagai 0,
        // sehingga sekali klik seluruh siswa yang belum dinilai tercatat 0 / predikat D.
        if(barisKosong(row)) continue;
        const salah = validasiBaris(row);
        if(salah){ pesanSalah = salah; break; }
        updates[row.dataset.siswa] = computeAndSave(row);
        jumlah++;
      }
      if(pesanSalah){ toast(pesanSalah,'err'); return; }
      if(!jumlah){ toast('Belum ada nilai yang diisi.','err'); return; }
      saveAll.disabled = true;
      await simpanAman(()=> db.ref(`nilai/${sid}/${kid}/${mid}/${semester}`).update(updates),
        jumlah + ' baris nilai tersimpan.');
      saveAll.disabled = false;
      refreshProgress();
    });
    el('btn-tpl-cp').addEventListener('click', ()=>{
      openModal(`
        <div style="padding:22px 24px;">
          <h3 style="font-size:16px;margin:0 0 4px;">Capaian Pembelajaran</h3>
          <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">${escHtml(mapel[mid]?.nama||'')} — Semester ${semester}. Tulis kompetensi yang dicapai (tanpa nama siswa dan tanpa kata "sangat mampu/mampu" — itu ditambahkan otomatis). Rapor tiap siswa akan berbunyi: <em>"[nama], [kualifikasi] [teks di bawah]."</em></p>
          <textarea id="f-cp" class="box-input" rows="4" style="resize:vertical;line-height:1.5;" placeholder="Contoh: menganalisis siklus hidup makhluk hidup dan upaya pelestariannya">${escHtml(capaianTeks)}</textarea>
          <div style="font-size:12px;color:var(--text-soft);margin-top:10px;line-height:1.7;">Kualifikasi otomatis berdasarkan nilai akhir:<br>${CAPAIAN_KUALIFIKASI.map(k=>`${k.min}${k.max<100?'–'+k.max:' ke atas'} → <strong>${escHtml(k.label)}</strong> ("${escHtml(k.frasa)}")`).join('<br>')}</div>
          <div class="modal-footer-sticky">
            <button class="btn btn-outline btn-sm" onclick="closeModal()">Batal</button>
            <button class="btn btn-primary btn-sm" id="save-tpl-cp">Simpan</button>
          </div>
        </div>`);
      el('save-tpl-cp').addEventListener('click', async ()=>{
        const teks = el('f-cp').value.trim();
        const ok = await simpanAman(()=> db.ref(`capaian/${sid}/${kid}/${mid}/${semester}`).set(teks), 'Capaian Pembelajaran tersimpan.');
        if(!ok) return;
        closeModal();
        loadNilaiTable();
      });
    });
  }
  el('sel-assign').addEventListener('change', loadNilaiTable);
  el('sel-sem').addEventListener('change', ()=>{ setSemesterView(el('sel-sem').value); loadNilaiTable(); });
  loadNilaiTable();
}
/* Rentang nilai akhir → kualifikasi deskriptif otomatis untuk Capaian Pembelajaran.
   Catatan: 65–74 dan 75–84 digabung menjadi satu pita "Baik" karena rentang yang
   diminta sebelumnya tumpang tindih dan memakai label yang sama. */
const CAPAIAN_KUALIFIKASI = [
  {min:85, max:100, label:'Sangat Baik', frasa:'Sangat mampu'},
  {min:65, max:84,  label:'Baik',        frasa:'Mampu'},
  {min:55, max:64,  label:'Cukup',       frasa:'Cukup mampu'},
  {min:0,  max:54,  label:'Perlu Bimbingan', frasa:'Masih perlu bimbingan untuk'},
];
function capaianKualifikasi(nilai){
  if(typeof nilai !== 'number') return null;
  return CAPAIAN_KUALIFIKASI.find(k=> nilai>=k.min && nilai<=k.max) || CAPAIAN_KUALIFIKASI[CAPAIAN_KUALIFIKASI.length-1];
}
/* Menyusun teks Capaian Pembelajaran seorang siswa: "[nama], [kualifikasi] [capaian]."
   teksKompetensi: string (diisi guru, satu untuk seluruh kelas & mapel);
   nilaiAkhir: number|undefined; siswa: {nama, namaPanggilan} */
function buildCapaianText(teksKompetensi, nilaiAkhir, siswa){
  if(typeof teksKompetensi !== 'string' || !teksKompetensi.trim()) return {ok:false, text:'Guru mapel belum mengisi Capaian Pembelajaran untuk mapel ini.'};
  if(typeof nilaiAkhir !== 'number') return {ok:false, text:'Isi nilai lebih dulu untuk melihat deskripsi.'};
  const kualifikasi = capaianKualifikasi(nilaiAkhir);
  const namaPakai = (siswa && (siswa.namaPanggilan || (siswa.nama||'').trim().split(/\s+/)[0])) || '';
  const teks = teksKompetensi.trim().replace(/\.$/, '');
  return {ok:true, text: `${namaPakai}, ${kualifikasi.frasa} ${teks}.`};
}
function predikatBadge(p){
  const colors = {A:['#DCEBDF','#2C5334'], B:['#DCE7F5','#28477A'], C:['#FBE9C6','#7A5A0E'], D:['#F6DCD9','#8A2E24']};
  const c = colors[p]||colors.D;
  return `<span class="badge" style="background:${c[0]};color:${c[1]};">${p}</span>`;
}

          <button type="button" id="add-ekskul" class="btn btn-outline btn-sm" style="margin-top:8px;">${iconPlus()} Tambah Ekstrakurikuler</button>
        </div>
        ${semester==='2'? `<input id="f-keputusan" class="box-input" placeholder="Keputusan (mis. Naik ke Kelas V / Tinggal di Kelas IV)" value="${escHtml(r.keputusan||'')}">` : ''}
        <input id="f-tempattgl" class="box-input" placeholder="Tempat, tanggal rapor dicetak" value="${escHtml(r.tempatTanggal||defaultTempatTanggal())}">
      </div>

        <button class="btn btn-outline btn-sm" id="finalize-btn">${iconLock()} ${r.finalized?'Buka Kunci':'Kunci Rapor'}</button>

          <button class="btn btn-outline btn-sm" onclick="closeModal()">Batal</button>
          <button class="btn btn-primary btn-sm" id="save-rapor">Simpan</button>
        </div>
      </div>
    </div>`);
  function ekskulRowHtml(item){
    item = item||{};
    return `<div class="ekskul-row" style="display:flex;gap:8px;align-items:center;">
      <input class="box-input ek-nama" placeholder="Nama kegiatan (mis. Pramuka)" value="${escHtml(item.nama||'')}" style="flex:2;">
      <input class="box-input ek-nilai" placeholder="Nilai/Predikat (mis. Baik)" value="${escHtml(item.nilai||'')}" style="flex:1;">
      <button type="button" class="btn btn-danger btn-sm del-ekskul-row">${iconTrash()}</button>
    </div>`;
  }
  const ekskulWrap = el('ekskul-rows');
  const existingEkskul = Array.isArray(r.ekstrakurikuler) && r.ekstrakurikuler.length? r.ekstrakurikuler : [{}];
  ekskulWrap.innerHTML = existingEkskul.map(ekskulRowHtml).join('');
  ekskulWrap.addEventListener('click', (ev)=>{
    const btn = ev.target.closest('.del-ekskul-row');
    if(!btn) return;
    const rows = ekskulWrap.querySelectorAll('.ekskul-row');
    if(rows.length>1) btn.closest('.ekskul-row').remove();
    else btn.closest('.ekskul-row').querySelectorAll('input').forEach(i=>i.value='');
  });
  el('add-ekskul').addEventListener('click', ()=>{
    ekskulWrap.insertAdjacentHTML('beforeend', ekskulRowHtml());
  });
  function getEkskulData(){
    return Array.from(ekskulWrap.querySelectorAll('.ekskul-row')).map(row=>({
      nama: row.querySelector('.ek-nama').value.trim(),
      nilai: row.querySelector('.ek-nilai').value.trim()
    })).filter(x=>x.nama);
  }
  const savePayload = ()=>({
    catatanWaliKelas: el('f-catatan').value.trim(),

      r.finalized? 'Rapor dibuka kembali.' : 'Rapor dikunci.');

    closeModal(); if(onSaved) onSaved();
  });
}

/* ===================== WALI KELAS ===================== */
async function renderWaliKelas(target, tab){
  const sid = state.user.sekolahId;
  if(tab==='notifikasi'){
    await renderNotifikasiWaliKelas(target);
    return;
  }
  const kelasId = state.user.kelasId;
  if(!kelasId){ target.innerHTML = `<div class="card" style="padding:22px;">Anda belum ditugaskan sebagai wali kelas manapun. Hubungi Admin Sekolah.</div>`; return; }
  target.innerHTML = loadingCard('Memuat data kelas…');
  await refreshSekolahData();
  let kelasInfo = {}, mapel = {}, siswaList = [];
  try{
    const [kSnap, mSnap, sList] = await Promise.all([
      db.ref('kelas/'+sid+'/'+kelasId).once('value'), db.ref('mapel/'+sid).once('value'),
      fetchSiswaByKelas(sid, kelasId)
    ]);
    kelasInfo = kSnap.val()||{};
    mapel = mSnap.val()||{};
    siswaList = sList;
  }catch(e){
    console.error(e);
    target.innerHTML = errorCard(describeDbError(e));
    return;
  }
  // Jaring pengaman: jika data kelas ini belum punya nama wali kelas tersalin (kelas lama),
  // lengkapi diam-diam memakai data akun sendiri, agar rapor siswa tidak lagi kosong walau
  // Admin Sekolah belum sempat membuka halaman Data Kelas untuk memicu backfill di sana.
  if(sameId(kelasInfo.waliKelasUid, state.user.uid) && !kelasInfo.waliKelasNama && state.user.nama){
    db.ref('kelas/'+sid+'/'+kelasId).update({ waliKelasNama: state.user.nama, waliKelasNip: state.user.nip||null })
      .then(()=>{ kelasInfo.waliKelasNama = state.user.nama; kelasInfo.waliKelasNip = state.user.nip||null; })
      .catch(e=>console.error('Gagal melengkapi data wali kelas:', e));
  }
  const siswaMap = {};
  siswaList.forEach(([id,u])=> siswaMap[id] = u);

  if(tab==='siswa'){
    target.innerHTML = pageHeader('Siswa Kelas '+kelasInfo.nama, siswaList.length+' siswa terdaftar.');
    const wrap = document.createElement('div'); wrap.className='card scroll-x';
    wrap.innerHTML = `<table class="ledger"><thead><tr><th>NIS</th><th>Nama</th><th>Email</th></tr></thead><tbody>
      ${siswaList.length? siswaList.map(([id,u])=>`<tr><td>${escHtml(u.nis||'-')}</td><td style="font-weight:600;">${escHtml(u.nama)}</td><td>${escHtml(u.email)}</td></tr>`).join('') :
      `<tr><td colspan="3" style="text-align:center;padding:22px;color:var(--text-soft);">Belum ada siswa.</td></tr>`}</tbody></table>`;
    target.appendChild(wrap);
    return;
  }

  if(tab==='rekap'){
    const semester = getSemesterView();
    const myToken = ++semRenderToken;
    target.innerHTML = pageHeader('Rekap Nilai Kelas '+kelasInfo.nama, 'Semester '+semester+' — seluruh mata pelajaran.', semesterSelectHtml('sel-sem-view'));
    bindSemesterSelect('sel-sem-view', ()=> renderWaliKelas(target, 'rekap'));
    const nilaiAll = {};
    try{
      const mids = Object.keys(mapel);
      const snaps = await Promise.all(mids.map(mid=> db.ref(`nilai/${sid}/${kelasId}/${mid}/${semester}`).once('value')));
      mids.forEach((mid,i)=>{ nilaiAll[mid] = snaps[i].val()||{}; });
    }catch(e){
      console.error(e);
      if(myToken!==semRenderToken) return;
      target.insertAdjacentHTML('beforeend', errorCard(describeDbError(e)));
      return;
    }
    if(myToken!==semRenderToken) return;
    const chartItems = sortedMapel(mapel).map(([mid,m])=>{
      const nilaiMapel = siswaList.map(([id])=>nilaiAll[mid][id]?.nilaiAkhir).filter(n=>typeof n==='number');
      const rata = nilaiMapel.length? Math.round(nilaiMapel.reduce((a,b)=>a+b,0)/nilaiMapel.length) : 0;
      return {label:m.nama, value:rata};
    });
    const chartWrap = document.createElement('div');
    chartWrap.style.marginBottom = '20px';
    chartWrap.innerHTML = chartCard('Rata-Rata Nilai per Mata Pelajaran', barListChart(chartItems, {max:100}));
    target.appendChild(chartWrap);
    const wrap = document.createElement('div'); wrap.className='card scroll-x';
    wrap.innerHTML = `<table class="ledger"><thead><tr><th>Nama</th>${sortedMapel(mapel).map(([id,m])=>`<th>${escHtml(m.nama)}</th>`).join('')}</tr></thead>
      <tbody>${siswaList.length? siswaList.map(([id,u])=>`
        <tr><td style="font-weight:600;">${escHtml(u.nama)}</td>
        ${sortedMapel(mapel).map(([mid,m])=>`<td>${nilaiAll[mid][id]?.nilaiAkhir!=null? bulat(nilaiAll[mid][id].nilaiAkhir) : '-'}</td>`).join('')}
        </tr>`).join('') : `<tr><td colspan="${Object.keys(mapel).length+1}" style="text-align:center;padding:22px;color:var(--text-soft);">Belum ada siswa.</td></tr>`}
      </tbody></table>`;
    target.appendChild(wrap);
    return;
  }

  if(tab==='rapor'){
    const semester = getSemesterView();
    const myToken = ++semRenderToken;
    target.innerHTML = pageHeader('Rapor & Catatan Wali Kelas', 'Semester '+semester+' — lengkapi catatan dan kunci rapor.', semesterSelectHtml('sel-sem-view'));
    bindSemesterSelect('sel-sem-view', ()=> renderWaliKelas(target, 'rapor'));
    let raporData = {};
    try{
      const rSnap = await db.ref(`rapor/${sid}/${kelasId}/${semester}`).once('value');
      raporData = rSnap.val()||{};
    }catch(e){
      console.error(e);
      if(myToken!==semRenderToken) return;
      target.insertAdjacentHTML('beforeend', errorCard(describeDbError(e)));
      return;
    }
    if(myToken!==semRenderToken) return;
    const terkunci = siswaList.filter(([id])=>raporData[id]?.finalized).length;
    if(siswaList.length){
      const progWrap = document.createElement('div'); progWrap.className='card'; progWrap.style.padding='16px 20px'; progWrap.style.marginBottom='16px';
      progWrap.innerHTML = progressBar(terkunci, siswaList.length, 'Rapor sudah dikunci');
      target.appendChild(progWrap);
    }
    const wrap = document.createElement('div'); wrap.className='card scroll-x';
    wrap.innerHTML = `<table class="ledger"><thead><tr><th>Nama</th><th>Status</th><th></th></tr></thead>
      <tbody>${siswaList.length? siswaList.map(([id,u])=>{
        const r = raporData[id]||{};
        return `<tr>
          <td style="font-weight:600;">${escHtml(u.nama)}</td>
          <td>${r.finalized? '<span class="badge" style="background:#DCEBDF;color:#2C5334;">Terkunci</span>' : '<span class="badge" style="background:#F1EEE6;color:var(--text-soft);">Draf</span>'}</td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="btn btn-outline btn-sm edit-rapor" data-id="${id}">${iconEdit()} Catatan</button>
            <button class="btn btn-outline btn-sm print-rapor" data-id="${id}">${iconPrint()} Cetak</button>
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="3" style="text-align:center;padding:22px;color:var(--text-soft);">Belum ada siswa.</td></tr>`}
      </tbody></table>`;
    target.appendChild(wrap);

    wrap.querySelectorAll('.edit-rapor').forEach(b=>b.addEventListener('click', ()=>{
      const sidStudent = b.dataset.id;
      openCatatanRaporModal({
        sid, kelasId, semester, studentUid: sidStudent,
        studentNama: siswaMap[sidStudent]?.nama,
        initialData: raporData[sidStudent]||{},
        onSaved: ()=> renderWaliKelas(el('main-content'),'rapor'),
      });
    }));
    wrap.querySelectorAll('.print-rapor').forEach(b=>b.addEventListener('click', ()=> printRapor(sid, kelasId, semester, b.dataset.id)));
    return;
  }

  if(tab==='riwayat'){
    target.innerHTML = pageHeader('Riwayat Rapor Siswa', 'Lihat & cetak rapor siswa Kelas '+kelasInfo.nama+' dari kelas 1 SD s.d. kelas 12 SMA.',
      `<select id="sel-siswa-riwayat" class="box-input" style="min-width:220px;">
        <option value="">— Pilih siswa —</option>
        ${siswaList.map(([id,u])=>`<option value="${escHtml(id)}">${escHtml(u.nama)}</option>`).join('')}
      </select>`);
    const holder = document.createElement('div'); holder.id = 'riwayat-holder';
    target.appendChild(holder);
    if(!siswaList.length){
      holder.innerHTML = `<div class="card" style="padding:22px;text-align:center;color:var(--text-soft);">Belum ada siswa di kelas ini.</div>`;
      return;
    }
    el('sel-siswa-riwayat').addEventListener('change', (e)=>{
      const uidStudent = e.target.value;
      if(!uidStudent){ holder.innerHTML=''; return; }
      renderRiwayatKelasSiswa(holder, sid, uidStudent, {allowKoreksi:true});
    });
    return;
  }
}

/* ===================== SISWA ===================== */
async function renderSiswa(target, tab){

    target.appendChild(holder);
    await renderRiwayatKelasSiswa(holder, sid, state.user.uid);
    return;
  }
  if(tab==='profil'){
    const u = state.user;
    target.innerHTML = pageHeader('Profil Saya', '');
    target.innerHTML += `
      <div class="card" style="padding:22px;max-width:420px;">
        <div style="display:flex;flex-direction:column;gap:10px;font-size:14px;">
          <div><span style="color:var(--text-soft);">Nama</span><br>${escHtml(u.nama)}</div>

        </div>
      </div>`;

  }
  if(tab==='rapor'){
    await refreshSekolahData();

    const semester = getSemesterView();
    const myToken = ++semRenderToken;
    target.innerHTML = pageHeader('Rapor Saya', 'Tahun Ajaran '+(state.sekolahData?.tahunAjaranAktif||'-')+' — Semester '+semester,
      `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">${semesterSelectHtml('sel-sem-view')}<button id="btn-print-own" class="btn btn-primary btn-sm">${iconPrint()} Cetak Rapor</button></div>`);

      target.insertAdjacentHTML('beforeend', errorCard('Akun Anda belum terdaftar pada kelas manapun. Hubungi Admin Sekolah / Wali Kelas.'));
      return;
    }
    el('btn-print-own').addEventListener('click', ()=> printRapor(sid, kelasId, semester, state.user.uid));
    let mapel = {}, raporInfo = {};
    const nilaiRows = [];
    try{
      const [mSnap, rSnap] = await Promise.all([
        db.ref('mapel/'+sid).once('value'), db.ref(`rapor/${sid}/${kelasId}/${semester}/${state.user.uid}`).once('value')
      ]);
      mapel = mSnap.val()||{};
      raporInfo = rSnap.val()||{};
      for(const [mid,m] of sortedMapel(mapel)){
        const nS = await db.ref(`nilai/${sid}/${kelasId}/${mid}/${semester}/${state.user.uid}`).once('value');
        // Capaian dibaca terpisah: bila aturan keamanan menolaknya, nilai tetap tampil.
        let capaianTeks = '';
        try{ capaianTeks = (await db.ref(`capaian/${sid}/${kelasId}/${mid}/${semester}`).once('value')).val()||''; }
        catch(e){ console.error(e); }
        const nv = nS.val()||{};
        const cp = buildCapaianText(capaianTeks, nv.nilaiAkhir, state.user);
        nilaiRows.push({nama:m.nama, ...nv, cp: cp.ok? cp.text : ''});
      }
    }catch(e){
      console.error(e);
      if(myToken!==semRenderToken) return;
      target.insertAdjacentHTML('beforeend', errorCard(describeDbError(e)));

    }
    if(myToken!==semRenderToken) return;
    if(nilaiRows.some(n=>n.nilaiAkhir!=null)){
      const chartWrap = document.createElement('div'); chartWrap.style.marginBottom='18px';
      chartWrap.innerHTML = chartCard('Grafik Nilai per Mata Pelajaran', barListChart(

      ));
      target.appendChild(chartWrap);
