    const wrap = document.createElement('div'); wrap.className='card scroll-x';
    wrap.innerHTML = `
      ${!raporInfo.finalized? `<div style="padding:12px 18px;background:#FBE9C6;color:#7A5A0E;font-size:13px;">Rapor semester ini belum dikunci oleh wali kelas — nilai dapat berubah.</div>`:''}
      <table class="ledger">
        <thead><tr><th>Mata Pelajaran</th><th>Tugas</th><th>UTS</th><th>UAS</th><th>Nilai Akhir</th><th>Predikat</th></tr></thead>
        <tbody>${nilaiRows.length? nilaiRows.map(n=>`
          <tr><td style="font-weight:600;">${escHtml(n.nama)}</td><td>${n.tugas??'-'}</td><td>${n.uts??'-'}</td><td>${n.uas??'-'}</td>
          <td style="font-weight:700;">${n.nilaiAkhir!=null? bulat(n.nilaiAkhir) : '-'}</td><td>${n.predikat? predikatBadge(n.predikat):'-'}</td></tr>
          <tr><td colspan="6" style="font-size:12.5px;color:var(--text-soft);padding-top:2px;padding-bottom:12px;"><strong style="color:var(--text);">Capaian Pembelajaran:</strong> ${n.cp? escHtml(n.cp).replace(/\n/g,'<br>') : '<span style="font-style:italic;">Belum diisi.</span>'}</td></tr>`).join('') :
          `<tr><td colspan="6" style="text-align:center;padding:22px;color:var(--text-soft);">Belum ada nilai tercatat.</td></tr>`}
        </tbody>
      </table>`;
    target.appendChild(wrap);
    const noteCard = document.createElement('div');
    noteCard.className = 'card'; noteCard.style.padding='20px 22px'; noteCard.style.marginTop='18px';
    noteCard.innerHTML = `
      <h3 style="font-size:14.5px;margin:0 0 10px;">Catatan Wali Kelas</h3>
      <p style="font-size:13.5px;color:var(--text);margin:0 0 14px;">${raporInfo.catatanWaliKelas ? escHtml(raporInfo.catatanWaliKelas) : '<span style="color:var(--text-soft)">Belum ada catatan.</span>'}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:13px;">
        <div><span style="color:var(--text-soft);">Sikap Spiritual</span><br>${escHtml(raporInfo.sikap?.spiritual||'-')}</div>
        <div><span style="color:var(--text-soft);">Sikap Sosial</span><br>${escHtml(raporInfo.sikap?.sosial||'-')}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;font-size:13px;margin-top:14px;">
        <div><span style="color:var(--text-soft);">Sakit</span><br>${raporInfo.kehadiran?.sakit??0} hari</div>
        <div><span style="color:var(--text-soft);">Izin</span><br>${raporInfo.kehadiran?.izin??0} hari</div>
        <div><span style="color:var(--text-soft);">Tanpa Keterangan</span><br>${raporInfo.kehadiran?.alpa??0} hari</div>
      </div>
      ${Array.isArray(raporInfo.ekstrakurikuler) && raporInfo.ekstrakurikuler.length? `
      <div style="margin-top:14px;">
        <span style="color:var(--text-soft);font-size:13px;">Ekstrakurikuler</span>
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px;font-size:13.5px;">
          ${raporInfo.ekstrakurikuler.map(e=>`<div>${escHtml(e.nama||'')} — <strong>${escHtml(e.nilai||'-')}</strong></div>`).join('')}
        </div>
      </div>` : ''}`;
    target.appendChild(noteCard);
  }

/* ===================== RIWAYAT RAPOR (KELAS 1 s.d. 12) ===================== */
/* Menampilkan daftar seluruh kelas yang pernah/sedang diikuti seorang siswa (dari riwayatKelas
   yang dicatat otomatis saat Admin Sekolah mengganti kelas siswa, ditambah kelas yang sedang
   berjalan), lalu menyediakan tombol cetak rapor per semester untuk tiap kelas tersebut.
   Bisa dipanggil dari halaman Siswa (untuk dirinya sendiri) maupun Wali Kelas (untuk siswa
   di kelasnya), karena hanya membutuhkan sid + uid siswa.
   opts.allowKoreksi=true (dipakai wali kelas) menambahkan kolom aksi untuk mengirim
   notifikasi koreksi ke wali kelas kelas sebelumnya, atau memperbaiki langsung bila
   wali kelas yang sedang login masih menjadi wali kelas aktif kelas tersebut. */
async function renderRiwayatKelasSiswa(target, sid, uid, opts){
  opts = opts || {};
  target.innerHTML = loadingCard('Memuat riwayat kelas…');
  let u = {}, kelasAll = {}, sekolahData = {};
  try{
    const [uSnap, kSnap, sSnap] = await Promise.all([
      db.ref('users/'+uid).once('value'),
      db.ref('kelas/'+sid).once('value'),
      db.ref('sekolah/'+sid).once('value'),
    ]);
    u = uSnap.val() || {};
    kelasAll = kSnap.val() || {};
    sekolahData = sSnap.val() || {};
  }catch(e){
    console.error(e);
    target.innerHTML = errorCard(describeDbError(e));
    return;
  }
  const entries = Object.values(u.riwayatKelas || {}).map(r=>({
    kelasId: r.kelasId, kelasNama: r.kelasNama || '(kelas tidak diketahui)', tingkat: r.tingkat || '',
    tahunAjaran: r.tahunAjaran || '-', waliKelasUid: r.waliKelasUid || null, waliKelasNama: r.waliKelasNama || null,
    current: false,
  }));
  if(u.kelasId){
    entries.push({
      kelasId: u.kelasId,
      kelasNama: kelasAll[u.kelasId]?.nama || '(kelas tidak diketahui)',
      tingkat: kelasAll[u.kelasId]?.tingkat || '',
      tahunAjaran: sekolahData.tahunAjaranAktif || '-',
      waliKelasUid: kelasAll[u.kelasId]?.waliKelasUid || null,
      waliKelasNama: kelasAll[u.kelasId]?.waliKelasNama || null,
      current: true,
    });
  }
  entries.sort((a,b)=>{
    const ta = parseFloat(a.tingkat), tb = parseFloat(b.tingkat);
    if(!isNaN(ta) && !isNaN(tb) && ta!==tb) return ta-tb;
    if(a.tahunAjaran !== b.tahunAjaran) return String(a.tahunAjaran).localeCompare(String(b.tahunAjaran));
    return 0;
  });
  function aksiKoreksiHtml(en){
    if(!opts.allowKoreksi || en.current) return '';
    if(sameId(state.user.kelasId, en.kelasId)){
      return `<button class="btn btn-outline btn-sm koreksi-sendiri" data-kelas="${escHtml(en.kelasId)}" data-sem="1">${iconEdit()} Perbaiki Smt 1</button>
              <button class="btn btn-outline btn-sm koreksi-sendiri" data-kelas="${escHtml(en.kelasId)}" data-sem="2">${iconEdit()} Perbaiki Smt 2</button>`;
    }
    if(en.waliKelasUid && !sameId(en.waliKelasUid, state.user.uid)){
      return `<button class="btn btn-outline btn-sm kirim-notif" data-kelas="${escHtml(en.kelasId)}" data-kelasnama="${escHtml(en.kelasNama)}"
                data-tingkat="${escHtml(en.tingkat)}" data-tahun="${escHtml(en.tahunAjaran)}" data-wali="${escHtml(en.waliKelasUid)}"
                data-walinama="${escHtml(en.waliKelasNama||'')}">${iconUsers()} Kirim Notifikasi</button>`;
    }
    return `<span style="font-size:12px;color:var(--text-soft);font-style:italic;">Wali kelas tidak diketahui — hubungi Admin Sekolah.</span>`;
  }
  const wrap = document.createElement('div'); wrap.className='card scroll-x';
  wrap.innerHTML = `
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-soft);">
      ${escHtml(u.nama||'')} ${u.nis? '— NIS '+escHtml(u.nis) : ''}
    </div>
    <table class="ledger">
      <thead><tr><th>Tingkat</th><th>Kelas</th><th>Tahun Ajaran</th><th>Status</th><th></th>${opts.allowKoreksi? '<th>Koreksi</th>':''}</tr></thead>
      <tbody>
      ${entries.length? entries.map(en=>`
        <tr>
          <td>${escHtml(en.tingkat||'-')}</td>
          <td style="font-weight:600;">${escHtml(en.kelasNama)}</td>
          <td>${escHtml(en.tahunAjaran)}</td>
          <td>${en.current? '<span class="badge" style="background:#DCEBDF;color:#2C5334;">Kelas saat ini</span>' : '<span class="badge" style="background:#F1EEE6;color:var(--text-soft);">Riwayat</span>'}</td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="btn btn-outline btn-sm riwayat-print" data-kelas="${escHtml(en.kelasId)}" data-sem="1">${iconPrint()} Smt 1</button>
            <button class="btn btn-outline btn-sm riwayat-print" data-kelas="${escHtml(en.kelasId)}" data-sem="2">${iconPrint()} Smt 2</button>
          </td>
          ${opts.allowKoreksi? `<td style="text-align:right;white-space:nowrap;">${aksiKoreksiHtml(en)}</td>` : ''}
        </tr>`).join('') : `<tr><td colspan="${opts.allowKoreksi?6:5}" style="text-align:center;padding:22px;color:var(--text-soft);">Belum ada riwayat kelas.</td></tr>`}
      </tbody>
    </table>`;
  target.innerHTML = '';
  target.appendChild(wrap);
  wrap.querySelectorAll('.riwayat-print').forEach(b=>b.addEventListener('click', ()=>
    printRapor(sid, b.dataset.kelas, b.dataset.sem, uid)));

  wrap.querySelectorAll('.koreksi-sendiri').forEach(b=>b.addEventListener('click', async ()=>{
    const kelasIdTarget = b.dataset.kelas, semTarget = b.dataset.sem;
    let initialData = {};
    try{ initialData = (await db.ref(`rapor/${sid}/${kelasIdTarget}/${semTarget}/${uid}`).once('value')).val() || {}; }
    catch(e){ console.error(e); toast(pesanGagalSimpan(e),'err'); return; }
    openCatatanRaporModal({
      sid, kelasId: kelasIdTarget, semester: semTarget, studentUid: uid, studentNama: u.nama,
      initialData, onSaved: ()=> renderRiwayatKelasSiswa(target, sid, uid, opts),
    });
  }));

  wrap.querySelectorAll('.kirim-notif').forEach(b=>b.addEventListener('click', ()=>{
    const d = b.dataset;
    openModal(`
      <div style="padding:26px;">
        <h3 style="margin:0 0 6px;font-size:17px;">Kirim Notifikasi Perbaikan Rapor</h3>
        <p style="font-size:13px;color:var(--text-soft);margin:0 0 16px;">
          Kepada Wali Kelas <strong>${escHtml(d.walinama||'kelas terkait')}</strong> (${escHtml(d.kelasnama)}, Tingkat ${escHtml(d.tingkat)}, TA ${escHtml(d.tahun)})
          — mengenai rapor <strong>${escHtml(u.nama||'')}</strong>.
        </p>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <select id="f-notif-sem" class="box-input">
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
          </select>
          <textarea id="f-notif-pesan" class="box-input" rows="4" placeholder="Jelaskan bagian data rapor yang perlu diperbaiki..."></textarea>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">
          <button class="btn btn-outline btn-sm" onclick="closeModal()">Batal</button>
          <button class="btn btn-primary btn-sm" id="kirim-notif-btn">Kirim</button>
        </div>
      </div>`);
    el('kirim-notif-btn').addEventListener('click', async ()=>{
      const pesan = el('f-notif-pesan').value.trim();
      if(!pesan){ toast('Isi pesan terlebih dahulu.','err'); return; }
      const payload = {
        dariUid: state.user.uid, dariNama: state.user.nama || '',
        siswaUid: uid, siswaNama: u.nama || '',
        kelasId: d.kelas, kelasNama: d.kelasnama, tingkat: d.tingkat, tahunAjaran: d.tahun,
        semester: el('f-notif-sem').value,
        pesan, status: 'baru', createdAt: Date.now(),
      };
      const ok = await simpanAman(()=> db.ref('notifikasi/'+sid+'/'+d.wali).push(payload), 'Notifikasi terkirim ke wali kelas terkait.');
      if(!ok) return;
      closeModal();
    });
  }));
}

/* ===================== NOTIFIKASI KOREKSI RAPOR (antar wali kelas) ===================== */
async function renderNotifikasiWaliKelas(target){
  const sid = state.user.sekolahId, uidSaya = state.user.uid;
  target.innerHTML = loadingCard('Memuat notifikasi…');
  let list = [];
  try{
    const snap = await db.ref('notifikasi/'+sid+'/'+uidSaya).once('value');
    const val = snap.val() || {};
    list = Object.entries(val).map(([id,n])=>({id, ...n})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }catch(e){
    console.error(e);
    target.innerHTML = errorCard(describeDbError(e));
    return;
  }
  target.innerHTML = pageHeader('Notifikasi Koreksi Rapor', 'Permintaan perbaikan data rapor dari wali kelas lain, untuk siswa yang pernah ada di kelas Anda.');
  if(!list.length){
    target.insertAdjacentHTML('beforeend', `<div class="card" style="padding:22px;text-align:center;color:var(--text-soft);">Belum ada notifikasi masuk.</div>`);
    return;
  }
  const wrap = document.createElement('div'); wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.gap='12px';
  list.forEach(n=>{
    const card = document.createElement('div'); card.className='card'; card.style.padding='18px 20px';
    const bisaLangsung = sameId(state.user.kelasId, n.kelasId);
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:700;font-size:14.5px;">${escHtml(n.siswaNama||'')} — ${escHtml(n.kelasNama||'')} (Tingkat ${escHtml(n.tingkat||'-')}, TA ${escHtml(n.tahunAjaran||'-')}, Semester ${escHtml(n.semester||'-')})</div>
          <div style="font-size:12.5px;color:var(--text-soft);margin-top:2px;">Dari: ${escHtml(n.dariNama||'-')} · ${n.createdAt? new Date(n.createdAt).toLocaleString('id-ID') : ''}</div>
        </div>
        <div>${n.status==='selesai'? '<span class="badge" style="background:#DCEBDF;color:#2C5334;">Selesai</span>' : '<span class="badge" style="background:#FBE9C6;color:#7A5A0E;">Baru</span>'}</div>
      </div>
      <p style="font-size:13.5px;margin:12px 0;white-space:pre-wrap;">${escHtml(n.pesan||'')}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">
        ${bisaLangsung? `<button class="btn btn-primary btn-sm buka-perbaiki" data-id="${escHtml(n.id)}">${iconEdit()} Buka & Perbaiki Rapor</button>` :
          `<span style="font-size:12px;color:var(--text-soft);font-style:italic;align-self:center;">Anda bukan wali kelas aktif untuk kelas ini — hubungi Admin Sekolah bila perlu akses.</span>`}
        ${n.status!=='selesai'? `<button class="btn btn-outline btn-sm tandai-selesai" data-id="${escHtml(n.id)}">Tandai Selesai</button>` : ''}
      </div>`;
    wrap.appendChild(card);
  });
  target.appendChild(wrap);

  wrap.querySelectorAll('.tandai-selesai').forEach(b=>b.addEventListener('click', async ()=>{
    const ok = await simpanAman(()=> db.ref(`notifikasi/${sid}/${uidSaya}/${b.dataset.id}/status`).set('selesai'), 'Notifikasi ditandai selesai.');
    if(ok) renderNotifikasiWaliKelas(target);
  }));
  wrap.querySelectorAll('.buka-perbaiki').forEach(b=>b.addEventListener('click', async ()=>{
    const n = list.find(x=>x.id===b.dataset.id);
    if(!n) return;
    let initialData = {};
    try{ initialData = (await db.ref(`rapor/${sid}/${n.kelasId}/${n.semester}/${n.siswaUid}`).once('value')).val() || {}; }
    catch(e){ console.error(e); toast(pesanGagalSimpan(e),'err'); return; }
    openCatatanRaporModal({
      sid, kelasId: n.kelasId, semester: n.semester, studentUid: n.siswaUid, studentNama: n.siswaNama,
      initialData,
      onSaved: async ()=>{
        await simpanAman(()=> db.ref(`notifikasi/${sid}/${uidSaya}/${n.id}/status`).set('selesai'));
        renderNotifikasiWaliKelas(target);
      },
    });
  }));
}

/* ===================== PRINT RAPOR ===================== */
async function printRapor(sid, kelasId, semester, siswaUid){
  let uSnap, mSnap, nAllSnap, cAllSnap, rSnap, kSnap, waliSnap;
  try{
    [uSnap, mSnap, nAllSnap, rSnap, kSnap] = await Promise.all([
      db.ref('users/'+siswaUid).once('value'), db.ref('mapel/'+sid).once('value'),
      db.ref(`nilai/${sid}/${kelasId}`).once('value'),
      db.ref(`rapor/${sid}/${kelasId}/${semester}/${siswaUid}`).once('value'),
      db.ref('kelas/'+sid+'/'+kelasId).once('value')
    ]);
  }catch(e){
    console.error(e);
    toast(describeDbError(e), 'err');
    return;
  }
  const siswa = uSnap.val()||{}, mapel = mSnap.val()||{}, nAll = nAllSnap.val()||{}, rapor = rSnap.val()||{}, kelasInfo = kSnap.val()||{};
  if(Object.keys(mapel).length === 0){
    toast('Data mata pelajaran belum tersedia, rapor belum dapat dicetak.', 'err');
    return;
  }
  // Templat Capaian & data wali kelas dibaca terpisah agar rapor tetap bisa dicetak
  // walau salah satunya belum diizinkan aturan keamanan atau belum diisi.
  try{ cAllSnap = await db.ref(`capaian/${sid}/${kelasId}`).once('value'); }
  catch(e){ console.error(e); cAllSnap = null; toast('Templat capaian pembelajaran tidak dapat dimuat, rapor dicetak tanpa deskripsi.', 'err'); }
  const cAll = (cAllSnap && cAllSnap.val())||{};
  // Utamakan nama/NIP wali kelas yang sudah disalin ke data kelas (denormalisasi) —
  // ini tetap tampil walau akun yang login (mis. siswa) tidak diizinkan membaca node "users" lain.
  // Pembacaan "users" di bawah hanya cadangan untuk data kelas lama yang belum disimpan ulang.
  let wali = { nama: kelasInfo.waliKelasNama || null, nip: kelasInfo.waliKelasNip || null };
  // Percobaan baca "users" hanya masuk akal untuk peran yang mungkin diizinkan (bukan siswa) —
  // akun siswa selalu ditolak aturan keamanan Firebase untuk node ini, jadi dilewati saja
  // agar tidak memicu error permission_denied di konsol setiap kali siswa mencetak rapor.
  if(kelasInfo.waliKelasUid && !wali.nama && state.user.activeRole !== 'siswa'){
    try{
      waliSnap = await db.ref('users/'+kelasInfo.waliKelasUid).once('value');
      const w2 = waliSnap.val()||{};
      wali.nama = wali.nama || w2.nama; wali.nip = wali.nip || w2.nip;
    }catch(e){ console.error(e); }
  }
  const kepsek = state.sekolahData?.kepalaSekolah || {};

  const rows = sortedMapel(mapel).map(([mid,m],i)=>{
    const nv = nAll[mid]?.[semester]?.[siswaUid] || {};
    const cp = buildCapaianText(cAll[mid]?.[semester], nv.nilaiAkhir, siswa);
    return { no:i+1, nama:m.nama, nilaiAkhir: bulat(nv.nilaiAkhir), cp: cp.ok? cp.text : (nv.nilaiAkhir!=null? 'Deskripsi belum diatur oleh guru mapel.' : 'Nilai belum diisi.') };
  });
  const nilaiValid = rows.filter(r=>typeof r.nilaiAkhir==='number');
  const jumlah = nilaiValid.reduce((a,r)=>a+r.nilaiAkhir,0);
  const rataRata = nilaiValid.length? Math.round(jumlah/nilaiValid.length) : 0;
  const tempatTanggal = rapor.tempatTanggal || defaultTempatTanggal();

  let old = el('print-area'); if(old) old.remove();
  const div = document.createElement('div');
  div.id = 'print-area';
  div.innerHTML = `
    <div style="font-family:Inter,sans-serif;padding:34px 40px;max-width:780px;margin:0 auto;color:#1A1A1A;font-size:12.5px;line-height:1.55;">
      <table style="width:100%;margin-bottom:6px;table-layout:fixed;border-collapse:collapse;">
        <colgroup>
          <col style="width:95px;"><col style="width:33%;"><col style="width:95px;"><col>
        </colgroup>
        <tr>
          <td style="padding:2px 4px 2px 0;vertical-align:top;">Nama</td><td style="padding:2px 0;vertical-align:top;word-wrap:break-word;">: ${escHtml(siswa.nama||'')}</td>
          <td style="padding:2px 4px 2px 0;vertical-align:top;">Kelas</td><td style="padding:2px 0;vertical-align:top;word-wrap:break-word;">: ${escHtml(kelasInfo.nama||'')}</td>
        </tr>
        <tr>
          <td style="padding:2px 4px 2px 0;vertical-align:top;">NIS/NISN</td><td style="padding:2px 0;vertical-align:top;word-wrap:break-word;">: ${escHtml(siswa.nis||'')}</td>
          <td style="padding:2px 4px 2px 0;vertical-align:top;">Semester</td><td style="padding:2px 0;vertical-align:top;word-wrap:break-word;">: ${semesterLabel(semester)}</td>
        </tr>
        <tr>
          <td style="padding:2px 4px 2px 0;vertical-align:top;">Nama Sekolah</td><td style="padding:2px 0;vertical-align:top;word-wrap:break-word;">: ${escHtml(state.sekolahData?.nama||'')}</td>
          <td style="padding:2px 4px 2px 0;vertical-align:top;">Tahun Pelajaran</td><td style="padding:2px 0;vertical-align:top;word-wrap:break-word;">: ${escHtml(state.sekolahData?.tahunAjaranAktif||'')}</td>
        </tr>
        <tr>
          <td style="padding:2px 4px 2px 0;vertical-align:top;">Alamat</td><td colspan="3" style="padding:2px 0;vertical-align:top;"><span style="display:inline-block;max-width:230px;word-wrap:break-word;">: ${escHtml(state.sekolahData?.alamat||'')}</span></td>
        </tr>
      </table>
      <h2 style="font-family:Inter,sans-serif;text-align:left;font-size:14px;letter-spacing:0.3px;margin:18px 0 14px;">LAPORAN HASIL BELAJAR</h2>

      <div style="font-weight:700;margin-bottom:6px;">A. Nilai Capaian Kompetensi</div>
      <table style="width:100%;border-collapse:collapse;margin-bottom:14px;">
        <thead><tr>
          <th style="border:1px solid #333;padding:5px;width:30px;">No</th>
          <th style="border:1px solid #333;padding:5px;">Mata Pelajaran</th>
          <th style="border:1px solid #333;padding:5px;width:60px;">Nilai Akhir</th>
          <th style="border:1px solid #333;padding:5px;text-align:left;">Capaian Kompetensi</th>
        </tr></thead>
        <tbody>
        ${rows.map(r=>`<tr>
          <td style="border:1px solid #333;padding:5px;text-align:center;vertical-align:top;">${r.no}</td>
          <td style="border:1px solid #333;padding:5px;vertical-align:top;">${escHtml(r.nama)}</td>
          <td style="border:1px solid #333;padding:5px;text-align:center;vertical-align:top;font-weight:700;">${r.nilaiAkhir??'-'}</td>
          <td style="border:1px solid #333;padding:5px;vertical-align:top;">${escHtml(r.cp)}</td>
        </tr>`).join('')}
        <tr>
          <td colspan="3" style="border:1px solid #333;padding:5px;text-align:right;font-weight:700;">Jumlah</td>
          <td style="border:1px solid #333;padding:5px;font-weight:700;">${jumlah}</td>
        </tr>
        <tr>
          <td colspan="3" style="border:1px solid #333;padding:5px;text-align:right;font-weight:700;">Rata-Rata</td>
          <td style="border:1px solid #333;padding:5px;font-weight:700;">${rataRata}</td>
        </tr>
        </tbody>
      </table>

      <div style="font-weight:700;margin-bottom:4px;">B. Ekstrakurikuler</div>
      ${Array.isArray(rapor.ekstrakurikuler) && rapor.ekstrakurikuler.length? `
      <table style="width:100%;border-collapse:collapse;margin-bottom:14px;">
        <thead><tr>
          <th style="border:1px solid #333;padding:5px;">Kegiatan Ekstrakurikuler</th>
          <th style="border:1px solid #333;padding:5px;width:140px;">Nilai/Predikat</th>
        </tr></thead>
        <tbody>
        ${rapor.ekstrakurikuler.map(e=>`<tr>
          <td style="border:1px solid #333;padding:5px;">${escHtml(e.nama||'')}</td>
          <td style="border:1px solid #333;padding:5px;text-align:center;">${escHtml(e.nilai||'-')}</td>
        </tr>`).join('')}
        </tbody>
      </table>` : `<p style="margin:0 0 16px;">-</p>`}

      <div style="font-weight:700;margin-bottom:4px;">C. Ketidakhadiran</div>
      <table style="margin-bottom:14px;">
        <tr><td style="width:130px;padding:1px 0;">Sakit</td><td>: ${rapor.kehadiran?.sakit??0} hari</td></tr>
        <tr><td style="padding:1px 0;">Izin</td><td>: ${rapor.kehadiran?.izin??0} hari</td></tr>
        <tr><td style="padding:1px 0;">Tanpa Keterangan</td><td>: ${rapor.kehadiran?.alpa??0} hari</td></tr>
      </table>

      <div style="font-weight:700;margin-bottom:4px;">D. Catatan Wali Kelas</div>
      <p style="margin:0 0 16px;">${rapor.catatanWaliKelas? escHtml(rapor.catatanWaliKelas).replace(/\n/g,'<br>') : '-'}</p>

      ${semester==='2'? `
      <div style="margin-bottom:22px;">
        <div style="font-weight:700;margin-bottom:4px;">Keputusan</div>
        <p style="margin:0;">Berdasarkan hasil yang dicapai pada semester 1 dan 2, peserta didik ditetapkan :</p>
        <p style="margin:4px 0 0;font-weight:700;">${escHtml(rapor.keputusan || '— belum ditetapkan —')}</p>
      </div>` : ''}

      <table style="width:100%;margin-top:34px;">
        <tr><td colspan="3" style="text-align:right;padding-bottom:26px;">${escHtml(tempatTanggal)}</td></tr>
        <tr>
          <td style="width:34%;text-align:center;">Orang Tua/Wali</td>
          <td style="width:32%;"></td>
          <td style="width:34%;text-align:center;">Wali Kelas ${escHtml(kelasInfo.nama||'')}</td>
        </tr>
        <tr><td style="height:90px;"></td><td></td><td></td></tr>
        <tr>
          <td style="text-align:center;border-top:1px solid #1A1A1A;">&nbsp;</td>
          <td></td>
          <td style="text-align:center;font-weight:700;">${escHtml(wali.nama||'________________')}</td>
        </tr>
        <tr>
          <td></td><td></td>
          <td style="text-align:center;border-top:1px solid #1A1A1A;padding-top:2px;">${wali.nip? 'NIP. '+escHtml(wali.nip) : '&nbsp;'}</td>
        </tr>
      </table>
      <div style="text-align:center;margin-top:26px;">
        <div>Mengetahui</div>
        <div style="font-weight:700;">Kepala Sekolah</div>
        <div style="height:90px;"></div>
        <div><div style="font-weight:700;display:inline-block;min-width:220px;padding-top:2px;">${escHtml(kepsek.nama||'________________')}</div></div>
        <div><div style="border-top:1px solid #1A1A1A;display:inline-block;min-width:220px;padding-top:2px;">${kepsek.nip? 'NIP. '+escHtml(kepsek.nip) : '&nbsp;'}</div></div>
      </div>
    </div>`;
  document.body.appendChild(div);
  // beri waktu browser merender isi rapor sebelum dialog cetak dibuka
  await new Promise(r=>setTimeout(r, 150));
  window.print();
}

/* ===================== INIT ===================== */
render();
checkForUpdate();
</script>
</body>
</html>
